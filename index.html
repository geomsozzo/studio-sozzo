<script id="ponte-firebase">
/* Ponte verso Firebase.
   Ricostruisce claude.use('db') sopra Firestore, con accesso Google
   e copia locale che fa funzionare l'app anche senza campo. */
(function(){
  if(typeof window.claude!=='undefined' && window.claude) return;
  if(typeof firebase==='undefined'){ return; }

  var CONF = {
    apiKey: "AIzaSyAJnp-mjEVP2lKhvSTeZd4GhXpL9lk7Cj4",
    authDomain: "studio-sozzo.firebaseapp.com",
    projectId: "studio-sozzo",
    storageBucket: "studio-sozzo.firebasestorage.app",
    messagingSenderId: "968877636245",
    appId: "1:968877636245:web:d24fd32e99814b7f0c799c"
  };
  var PADRONE = "geomsozzo@gmail.com";

  firebase.initializeApp(CONF);
  var auth = firebase.auth();
  var fs   = firebase.firestore();
  window.SUFIREBASE = true;
  window.FS = fs;

  try{
    fs.enablePersistence({synchronizeTabs:true}).catch(function(){ });
  }catch(e){}

  /* ---------- l'archivio, con la stessa forma di prima ----------
     Il contenuto viaggia come un unico testo, campo "j". Firestore non
     ammette liste dentro liste e altre finezze che nei nostri dati ci sono,
     e come testo il problema non si pone. I documenti scritti alla vecchia
     maniera continuano a leggersi. */
  function impacchetta(o){ return { j: JSON.stringify(o) }; }
  function spacchetta(sn){
    var d = (sn && sn.exists) ? sn.data() : null;
    var v = null;
    if(d){
      if(typeof d.j === 'string'){ try{ v = JSON.parse(d.j); }catch(e){ v = null; } }
      else v = d;
    }
    return { exists: !!v, data: function(){ return v; }, metadata: sn && sn.metadata };
  }
  var db = {
    doc: function(id){
      var r = fs.doc(id);
      return {
        set: function(o){
          try{ return r.set(impacchetta(o)); }
          catch(e){ return Promise.reject(e); }
        },
        get: function(){ return r.get().then(spacchetta); },
        onSnapshot: function(cb, err){
          return r.onSnapshot(function(sn){ cb(spacchetta(sn)); }, err||function(){});
        }
      };
    }
  };

  /* ---------- la porta ---------- */
  var apri = null;
  var promessa = new Promise(function(ok){ apri = ok; });

  function schermata(stato, messaggio){
    var d = document.getElementById('cporta');
    if(!d){
      d = document.createElement('div');
      d.id = 'cporta';
      d.style.cssText = "position:fixed;inset:0;z-index:99998;background:#D5E8F6;color:#16202A;"+
        "display:flex;align-items:center;justify-content:center;padding:26px;"+
        "font:16px 'Archivo',system-ui,Arial;text-align:center;";
      document.body.appendChild(d);
    }
    if(stato==='via'){ d.remove(); return; }
    if(stato==='attesa'){
      d.innerHTML = '<div><div style="font-size:19px;font-weight:700;margin:0 0 6px">Studio Sozzo</div>'+
        '<div style="color:#5B7183;font-size:14px">'+(messaggio||'Un momento...')+'</div></div>';
      return;
    }
    d.innerHTML =
      '<div style="max-width:340px">'+
      '<div style="font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px">Studio Sozzo</div>'+
      '<div style="color:#5B7183;font-size:14px;margin:0 0 22px;line-height:1.5">'+
        (messaggio||'Entra con il tuo account Google per aprire il gestionale.')+'</div>'+
      '<button id="cporta-b" style="font:inherit;font-weight:700;font-size:15px;background:#1668DC;color:#fff;'+
        'border:0;border-radius:10px;padding:15px 26px;width:100%;cursor:pointer">Entra con Google</button>'+
      '</div>';
    document.getElementById('cporta-b').onclick = function(){
      schermata('attesa','Ti mando su Google...');
      var pr = new firebase.auth.GoogleAuthProvider();
      pr.setCustomParameters({prompt:'select_account'});
      auth.signInWithPopup(pr).catch(function(e){
        if(e && (e.code==='auth/popup-blocked' || e.code==='auth/operation-not-supported-in-this-environment' ||
                 e.code==='auth/cancelled-popup-request')){
          auth.signInWithRedirect(pr); return;
        }
        schermata('porta', 'Non sono riuscito ad entrare: '+((e&&e.message)||'')+'. Riprova.');
      });
    };
  }

  function pronto(f){ if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',f); else f(); }

  pronto(function(){
    schermata('attesa','Controllo l\'accesso...');
    auth.onAuthStateChanged(function(u){
      if(!u){ schermata('porta'); return; }
      if(String(u.email||'').toLowerCase() !== PADRONE){
        auth.signOut();
        schermata('porta','Questo account non è abilitato. Entra con '+PADRONE+'.');
        return;
      }
      window.UTENTE = {email:u.email, nome:u.displayName||'', foto:u.photoURL||''};
      schermata('via');
      apri(db);
    });
  });

  window.esci = function(){ try{ auth.signOut(); location.reload(); }catch(e){} };

  window.claude = { use: function(n){
    if(n==='db')  return promessa;
    if(n==='mcp') return Promise.resolve(null);
    return Promise.resolve(null);
  }};
})();
</script>

<style>
  :root{
    --ground:#D5E8F6; --surface:#FBFDFF; --surface-2:#EAF3FB; --surface-3:#DCEBF7;
    --ink:#16202A; --ink-soft:#39485A; --muted:#65788C;
    --line:#C4DAEA; --line-strong:#9EBED6;
    --accent:#1D6A8C; --accent-soft:#D5E9F3; --on-accent:#FFFFFF;
    --amber:#8A6210; --amber-soft:#F3ECD8;
    --red:#9C3527; --red-soft:#F2E1DD;
    --blue:#2A5470; --blue-soft:#E0E9ED;
    --c-ril:#2a78d6; --c-cat:#eb6834; --c-urb:#1baf7a; --c-dd:#eda100; --c-can:#e87ba4; --c-sop:#4a3aa7;
    --ev-scad:#C62828; --ev-fiss:#E8710A; --ev-conf:#E3B505; --ev-ok:#2E7D32;
    --u1:#E01B0F; --u2:#F58300; --u3:#1668DC; --u4:#17A34A;
    --u1s:#C4150B; --u2s:#B35E00; --u3s:#1257B8; --u4s:#0F7A37;
    --u1w:#FBE3E1; --u2w:#FBEBD6; --u3w:#DFEAFA; --u4w:#DDF2E4;

  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#101821; --surface:#17212C; --surface-2:#1E2A37; --surface-3:#253343;
    --ink:#E3EBF2; --ink-soft:#BECBD8; --muted:#8697A8;
    --line:#2A3846; --line-strong:#3D5163;
    --accent:#77BEDD; --accent-soft:#152633; --on-accent:#101821;
    --amber:#D6A742; --amber-soft:#2A2216;
    --red:#E08B7C; --red-soft:#2C1B17;
    --blue:#8FBBD6; --blue-soft:#16242C;
    --c-ril:#3987e5; --c-cat:#d95926; --c-urb:#199e70; --c-dd:#c98500; --c-can:#d55181; --c-sop:#9085e9;
    --ev-scad:#F07167; --ev-fiss:#F2924A; --ev-conf:#F2CE4B; --ev-ok:#67C27A;
    --u1:#FF5A47; --u2:#FFA02E; --u3:#5FA5FF; --u4:#4ACB74;
    --u1s:#FF5A47; --u2s:#FFA02E; --u3s:#5FA5FF; --u4s:#4ACB74;
    --u1w:#3A1512; --u2w:#382513; --u3w:#12233A; --u4w:#12301D;
  }}
  :root[data-theme="dark"]{
    --ground:#101821; --surface:#17212C; --surface-2:#1E2A37; --surface-3:#253343;
    --ink:#E3EBF2; --ink-soft:#BECBD8; --muted:#8697A8;
    --line:#2A3846; --line-strong:#3D5163;
    --accent:#77BEDD; --accent-soft:#152633; --on-accent:#101821;
    --amber:#D6A742; --amber-soft:#2A2216;
    --red:#E08B7C; --red-soft:#2C1B17;
    --blue:#8FBBD6; --blue-soft:#16242C;
    --c-ril:#3987e5; --c-cat:#d95926; --c-urb:#199e70; --c-dd:#c98500; --c-can:#d55181; --c-sop:#9085e9;
    --ev-scad:#F07167; --ev-fiss:#F2924A; --ev-conf:#F2CE4B; --ev-ok:#67C27A;
    --u1:#FF5A47; --u2:#FFA02E; --u3:#5FA5FF; --u4:#4ACB74;
    --u1s:#FF5A47; --u2s:#FFA02E; --u3s:#5FA5FF; --u4s:#4ACB74;
    --u1w:#3A1512; --u2w:#382513; --u3w:#12233A; --u4w:#12301D;
  }
  *{box-sizing:border-box;}
  body{background:var(--ground);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;}

  .app{max-width:none;margin:0;padding:0 24px 60px;}
  @media(min-width:1500px){ .app{padding:0 34px 70px;} }

  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0 14px;border-bottom:1px solid var(--line-strong);}
  .brand{font-weight:700;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;}
  .brand i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block;}
  .brand small{font-family:var(--m);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:400;border:1px solid var(--line-strong);padding:2px 6px;border-radius:999px;}
  .views{display:flex;flex-wrap:wrap;gap:6px 4px;margin-left:0;width:100%;align-items:center;}
  .views .brk{flex-basis:100%;height:0;margin:0;padding:0;order:3;}
  .views button[data-view="home"]{order:1;}
  .views button[data-view="can"]{order:2;}
  .views button[data-view]:not([data-view="home"]):not([data-view="can"]){order:4;}
  .views #newbtn{order:5;}
.views button{font-size:13.5px;padding:6px 13px;border-radius:999px;color:var(--muted);}
  .homebtn{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-soft)!important;font-weight:700;margin-right:8px;}
  .homebtn:hover{border-color:var(--accent);color:var(--accent)!important;}
  .views button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:600;}
  /* le due porte principali si vedono anche da spente: contornate, e piene quando le apri */
  .views button[data-view="home"],.views button[data-view="can"]{
    border:1.5px solid var(--line-strong);color:var(--ink-soft);font-weight:600;padding:6px 18px;}
  .views button[data-view="home"]:hover,.views button[data-view="can"]:hover{border-color:var(--accent);color:var(--accent);}
  .views button[data-view="home"][aria-selected="true"],.views button[data-view="can"][aria-selected="true"]{
    background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .views button[data-view="can"]{margin-right:8px;}
  .views button[data-view]:not([data-view="home"]):not([data-view="can"]){margin-top:2px;}
  .q{flex:1;min-width:190px;max-width:340px;}
  .q input{width:100%;font:inherit;font-size:13.5px;padding:7px 13px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);}
  .q input::placeholder{color:var(--muted);}

  h2.sec{font-size:14px;font-family:var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:26px 0 10px;}

  /* filtri */
  .bar{display:flex;flex-direction:column;gap:9px;padding:14px 0 12px;border-bottom:1px solid var(--line);}
  .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .grp .lab{font-family:var(--m);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);width:74px;flex:none;}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:5px 12px;border:1px solid var(--line-strong);border-radius:999px;color:var(--ink-soft);background:var(--surface);white-space:nowrap;}
  .chip .n{font-family:var(--m);font-size:12px;color:var(--muted);}
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;}
  .chip[aria-pressed="true"] .n{color:var(--on-accent);opacity:.75;}
  .chip.p1[aria-pressed="true"]{background:var(--u1s);border-color:var(--u1s);color:#fff;}
  .chip.p2[aria-pressed="true"]{background:var(--u2s);border-color:var(--u2s);color:#fff;}
  .chip.clear{border-style:dashed;color:var(--muted);}

  .count{font-size:14.5px;color:var(--muted);padding:10px 0 0;font-family:var(--m);letter-spacing:.04em;}

  /* liste */
  .split{display:grid;grid-template-columns:1fr;gap:18px;margin-top:6px;}
  @media(min-width:940px){.split{grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start;}
    .detail{position:sticky;top:14px;max-height:calc(100vh - 30px);overflow-y:auto;}}

  .rows{display:flex;flex-direction:column;}
  .row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;text-align:left;width:100%;padding:12px 10px;border-bottom:1px solid var(--line);border-radius:var(--r);}
  .row:hover{background:var(--surface);}
  .row[aria-current="true"]{background:var(--accent-soft);}
  .prio{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--m);font-size:12.5px;font-weight:600;border:1px solid;flex:none;margin-top:1px;}
  .prio.v1{color:#fff;background:var(--u1s);border-color:var(--u1s);}
  .prio.v2{color:#fff;background:var(--u2s);border-color:var(--u2s);}
  .prio.v3{color:#fff;background:var(--u3s);border-color:var(--u3s);}
  .prio.v4{color:#fff;background:var(--u4s);border-color:var(--u4s);}
  :root[data-theme="dark"] .prio.v1,:root[data-theme="dark"] .prio.v2,
  :root[data-theme="dark"] .prio.v3,:root[data-theme="dark"] .prio.v4{color:var(--ground);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .prio{color:var(--ground)!important;}}
  .row .t{font-weight:600;font-size:14.5px;letter-spacing:-.01em;}
  .row .s{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .row .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
  .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}

  .tag{font-family:var(--m);font-size:11.5px;letter-spacing:.06em;padding:2px 7px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
  .tag .dot{width:7px;height:7px;border-radius:50%;}
  .tag.st{border-color:var(--line-strong);}
  .tag.st.attesa{color:var(--amber);border-color:var(--amber);background:var(--amber-soft);}
  .tag.st.lav{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}
  .tag.st.verif{color:var(--blue);border-color:var(--blue);background:var(--blue-soft);}
  .tag.st.dorm{color:var(--muted);}
  .tag.late{color:var(--u2s);border-color:var(--u2);background:transparent;font-weight:600;}

  /* dettaglio */
  .detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 22px;}
  @media(min-width:1500px){ .stage-main{padding:26px 30px 32px;} }
  .detail .code{font-family:var(--m);font-size:12.5px;color:var(--accent);letter-spacing:.05em;}
  .detail h3{font-size:19px;letter-spacing:-.02em;margin:4px 0 2px;font-weight:700;}
  .detail .who{font-size:13.5px;color:var(--muted);}
  .fldrow{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .fldrow dt{font-family:var(--m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:3px;}
  .fldrow dd{margin:0;color:var(--ink-soft);}
  .box{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:10px 12px;font-size:13.5px;color:var(--ink-soft);margin:14px 0 0;background:var(--surface-2);}
  .box .k{font-family:var(--m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:3px;}
  .box.warn{border-left-color:var(--amber);} .box.warn .k{color:var(--amber);}
  .box.bad{border-left-color:var(--red);} .box.bad .k{color:var(--red);}
  .empty{color:var(--muted);font-size:14px;padding:40px 10px;text-align:center;}

  /* scrivania */
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 4px;}
  @media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr);}}
  .tile{border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;background:var(--surface);text-align:left;}
  .tile:hover{border-color:var(--accent);}
  .tile .v{font-size:clamp(26px,1.9vw,34px);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
  .tile .k{font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px;}
  .tile{border-left:4px solid var(--line-strong);}
  .tile.red{border-left-color:var(--red);background:var(--surface);} .tile.red .v{color:var(--red);}
  .tile.amber{border-left-color:var(--amber);background:var(--surface);} .tile.amber .v{color:var(--amber);}

  .note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 15px;border-radius:0 var(--r) var(--r) 0;font-size:13.5px;color:var(--ink-soft);margin:16px 0;}
  .note b{color:var(--ink);}
  /* impianto a tre zone */
  .work{display:grid;grid-template-columns:1fr;gap:16px;margin-top:14px;
    grid-template-areas:"railL" "stage" "railR";}
  .railL{grid-area:railL;} #stage{grid-area:stage;} .railR{grid-area:railR;}
  .railL,.railR,#stage,.railbox,.panel,.clientbox,.postawrap{min-width:0;}
  .cal-grid{min-width:0;} .day{min-width:0;}
  @media(min-width:960px){
    .work{grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start;
      grid-template-areas:"railL stage" "railR stage";}
    .rail{display:flex;flex-direction:column;gap:12px;min-height:0;}
  }
  @media(min-width:1200px) and (max-width:1499px){
    .cal{font-size:12.5px;}
    .cal .day{padding:5px 0;font-size:12.5px;}
    .cal-leg{font-size:10.5px;}
  }
  @media(min-width:1200px){
    .work{grid-template-columns:300px minmax(0,1fr) 300px;gap:16px;
      grid-template-areas:"railL stage railR";}
  }
  @media(min-width:1500px){ .work{grid-template-columns:340px minmax(0,1fr) 330px;gap:20px;} }
  @media(min-width:1750px){ .work{grid-template-columns:380px minmax(0,1fr) 360px;gap:24px;} }
  /* schermata fissa: scorre solo quello che deve scorrere */
  @media(min-width:1200px){
    html,body{height:100%;overflow:hidden;}

<script>
/* i dati veri non stanno piu' qui dentro: arrivano dall'archivio, documento stato/base, con copia locale per partire subito */
var DATA = {pratiche:[], clienti:[]};
var EX = {email:[], contatti:[], ordini:[], preventivi:[], agenda:[], agendaCal:[]};
/* copia locale, cosi' l'app parte subito e funziona anche senza rete */
try{
  var __base = JSON.parse(localStorage.getItem('urg-base')||'null');
  if(__base && __base.DATA && Array.isArray(__base.DATA.pratiche)){
    DATA = __base.DATA;
    if(__base.EX) EX = __base.EX;
  }
}catch(e){}
const CATS = [
  ['RIL','Rilievo','--c-ril'],['CAT','Catasto','--c-cat'],['URB','Urbanistica','--c-urb'],
  ['DD','Due diligence','--c-dd'],['CAN','Cantiere','--c-can'],['SOP','Sopralluogo','--c-sop']
];
const CATNAME = Object.fromEntries(CATS.map(c=>[c[0],c[1]]));
/* ---- spia degli errori: se qualcosa si rompe, lo scrive a schermo ---- */
function copiaErrore(btn){
  const box=btn.closest('#spiaerr'); if(!box) return;
  const t=box.innerText.replace(/Copia il messaggio|Chiudi/g,'').trim();
  const fine=function(ok){ btn.textContent=ok?'Copiato':'Selezionalo a mano e fai una foto'; };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ fine(true); }).catch(function(){ aMano(); });
      return;
    }
  }catch(e){}
  aMano();
  function aMano(){
    try{
      const a=document.createElement('textarea'); a.value=t;
      a.style.cssText='position:fixed;top:-2000px'; document.body.appendChild(a);
      a.focus(); a.select();
      const ok=document.execCommand('copy'); document.body.removeChild(a); fine(ok);
    }catch(e){ fine(false); }
  }
}
function mostraErrore(msg, file, riga){
  try{ sbloccaSchermo(); }catch(e){}
  try{
    let b=document.getElementById('spiaerr');
    if(!b){
      b=document.createElement('div'); b.id='spiaerr';
      b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:2147483647;background:#B3261E;color:#fff;'+
        'font:14px/1.5 system-ui,sans-serif;padding:14px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.35);'+
        'user-select:text;-webkit-user-select:text;max-height:40vh;overflow:auto';
      document.body.appendChild(b);
    }
    b.innerHTML='<b>Si e\' rotto qualcosa, ma l\'app resta usabile.</b><br>'+
      String(msg||'').slice(0,220)+'<br><span style="opacity:.8">'+String(file||'').split('/').pop()+' riga '+(riga||'?')+'</span>'+
      '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">'+
      '<button onclick="copiaErrore(this)" '+
      'style="background:#fff;color:#B3261E;border:0;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer">Copia il messaggio</button>'+
      '<button onclick="this.parentElement.parentElement.remove()" '+
      'style="background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;padding:6px 12px;cursor:pointer">Chiudi</button></div>';
  }catch(e){}
}
(function(){
  let sbloccato=false;
  window.addEventListener('click', function(e){
    const t=(e.target&&e.target.closest)?e.target.closest('[onclick]'):null;
    if(!t||t.tagName==='A') return;
    const attr=String(t.getAttribute('onclick')||'');
    if(attr.indexOf('stopPropagation')>=0) return;
    if(typeof t.onclick!=='function') return;
    if(!sbloccato){
      sbloccato=true;
      try{ Array.prototype.forEach.call(document.querySelectorAll('body > *'), function(nn){
        try{ if(getComputedStyle(nn).pointerEvents==='none') nn.style.pointerEvents='auto'; }catch(e4){} }); }catch(e5){}
    }
    e.stopPropagation();
    try{ t.onclick.call(t, e); }catch(e3){}
  }, true);
})();
window.__estranei=[];
function erroreNostro(file){
  const f=String(file||'');
  if(!f) return true;
  try{ if(f===location.href) return true; }catch(e){}
  try{ if(f.split('?')[0]===String(location.origin+location.pathname)) return true; }catch(e){}
  return false;
}
window.addEventListener('error', function(e){
  const f=e&&e.filename, m=e&&e.message;
  if(!erroreNostro(f)){ window.__estranei.push({m:m,f:f,r:e&&e.lineno,q:new Date().toISOString()}); return; }
  mostraErrore(m, f, e&&e.lineno);
});
window.addEventListener('unhandledrejection', function(e){
  const t=(e&&e.reason&&e.reason.message)||String(e&&e.reason||'');
  if(/hasAttribute|_transforms/.test(t)){ window.__estranei.push({m:t}); return; }
  mostraErrore('promessa non gestita: '+t);
});
/* ---- pulizia di sicurezza: niente resta appeso sopra la pagina ---- */
function sbloccaSchermo(){
  try{
    const st=document.getElementById('ca-stampa'); if(st) st.remove();
    const m=document.getElementById('can-modal'); if(m){ m.style.display='none'; m.innerHTML=''; }
    document.querySelectorAll('.modale').forEach(function(x){ x.remove(); });
    const pop=document.getElementById('ca-pop'); if(pop) pop.remove();
  }catch(e){}
}
document.addEventListener('keydown', function(e){ if(e.key==='Escape') sbloccaSchermo(); });
window.addEventListener('load', sbloccaSchermo);
const TODAY = new Date();
const state = {view:'home', prio:new Set(), cat:new Set(), stato:new Set(), q:'', sel:null, csel:null};

const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const days = d => { if(!d) return null; const t=new Date(d+'T00:00:00'); if(isNaN(t)) return null;
  return Math.round((TODAY - t)/86400000); };
const catsOf = p => (p.cat||'').split(/[\s,\/]+/).filter(x=>CATNAME[x]);
function preparaPratiche(){ DATA.pratiche.forEach((p,i)=>{ p._i=i; p._cats=catsOf(p); p._att=days(p.attesadal); }); }
preparaPratiche();

const statoClass = s => s==='IN ATTESA'||s==='INTEGRAZIONI' ? 'attesa'
  : s==='IN LAVORAZIONE'||s==='DA AVVIARE' ? 'lav'
  : s==='DA VERIFICARE' ? 'verif' : 'dorm';

function catDot(c){ const f=CATS.find(x=>x[0]===c); return f?`<i class="dot" style="background:var(${f[2]})"></i>`:''; }

function matches(p){
  if(state.prio.size && !state.prio.has(String(p.prio))) return false;
  if(state.cat.size){
    if(state.cat.has('__none__')){ if(p._cats.length) return false; }
    else if(!p._cats.some(c=>state.cat.has(c))) return false;
  }
  if(state.stato.size && !state.stato.has(p.stato)) return false;
  if(state.q){
    const h=[p.cliente,p.immobile,p.dettaglio,p.cartella,p.azione,p.attesadi,p.dachi,p.note].join(' ').toLowerCase();
    if(!h.includes(state.q)) return false;
  }
  return true;
}

/* ---------- filtri ---------- */
function chip(label,count,pressed,cls,dot){
  return `<button class="chip ${cls||''}" aria-pressed="${pressed}" ${dot?'':''}>${dot||''}<span>${label}</span><span class="n">${count}</span></button>`;
}
function buildFilters(){
  const P=document.getElementById('fprio'), C=document.getElementById('fcat'), S=document.getElementById('fstato');
  const cnt = f => DATA.pratiche.filter(f).length;
  P.innerHTML = ['1','2','3','4'].map(v=>chip('P'+v, cnt(p=>String(p.prio)===v), state.prio.has(v), 'p'+v)).join('')
    + (state.prio.size?`<button class="chip clear" data-clear="prio" aria-pressed="false">azzera</button>`:'');
  C.innerHTML = CATS.map(([k,n,v])=>chip(n, cnt(p=>p._cats.includes(k)), state.cat.has(k), '', `<i class="dot" style="background:var(${v})"></i>`)).join('')
    + chip('senza categoria', cnt(p=>!p._cats.length), state.cat.has('__none__'), '')
    + (state.cat.size?`<button class="chip clear" data-clear="cat" aria-pressed="false">azzera</button>`:'');
  const stati = [...new Set(DATA.pratiche.map(p=>p.stato).filter(Boolean))]
    .sort((a,b)=>cnt(p=>p.stato===b)-cnt(p=>p.stato===a));
  S.innerHTML = stati.map(s=>chip(s.toLowerCase(), cnt(p=>p.stato===s), state.stato.has(s), '')).join('')
    + (state.stato.size?`<button class="chip clear" data-clear="stato" aria-pressed="false">azzera</button>`:'');

  [[P,'prio',['1','2','3','4']],[C,'cat',CATS.map(c=>c[0]).concat('__none__')],[S,'stato',stati]].forEach(([el,key,vals])=>{
    [...el.querySelectorAll('button')].forEach((b,i)=>{
      b.onclick = () => {
        if(b.dataset.clear){ state[b.dataset.clear].clear(); }
        else { const v=vals[i]; state[key].has(v)?state[key].delete(v):state[key].add(v); }
        render();
      };
    });
  });
}

/* ---------- lista ---------- */
function rowHtml(p){
  const pr = String(p.prio||'4');
  const att = p._att!=null ? `<span class="tag ${p._att>14?'late':''}">ferma da ${p._att} gg</span>` : '';
  const cats = p._cats.length ? p._cats.map(c=>`<span class="tag">${catDot(c)}${CATNAME[c]}</span>`).join('')
    : `<span class="tag">senza categoria</span>`;
  return `<button class="row" aria-current="${state.sel===p._i}" data-i="${p._i}">
    <span class="prio v${pr}">${pr}</span>
    <span>
      <span class="t">${esc(p.cliente)}</span>
      <span class="s">${esc(p.immobile||'ubicazione non indicata')}${p.dettaglio?' · '+esc(p.dettaglio.slice(0,64)):''}</span>
      <span class="tags">${cats}<span class="tag st ${statoClass(p.stato)}">${esc((p.stato||'').toLowerCase())}</span>${att}</span>
    </span>
    <span class="right"></span>
  </button>`;
}
function renderList(){
  const items = DATA.pratiche.filter(matches).sort((a,b)=>
    (a.prio||9)-(b.prio||9) || (b._att||-1)-(a._att||-1));
  document.getElementById('count').textContent =
    `${items.length} pratiche su ${DATA.pratiche.length}`;
  const L=document.getElementById('list');
  L.innerHTML = items.length ? items.map(rowHtml).join('')
    : `<p class="empty">Nessuna pratica con questi filtri.</p>`;
  [...L.querySelectorAll('.row')].forEach(b=>b.onclick=()=>{state.sel=+b.dataset.i;render();});
  renderDetail();
}
function fld(k,v){ return v?`<div class="fldrow"><dt>${k}</dt><dd>${esc(v)}</dd></div>`:''; }
function renderDetail(){
  const D=document.getElementById('detail');
  const p = DATA.pratiche.find(x=>x._i===state.sel);
  if(!p){ D.innerHTML=`<p class="empty">Scegli una pratica dall'elenco per vederne la scheda.</p>`; return; }
  const codice = `2026-${String(p.id).padStart(3,'0')}_${(p.immobile||'').split(/[ ,(]/)[0].toUpperCase()||'DAINDICARE'}_${p._cats[0]||'??'}`;
  D.innerHTML = `
    <div class="code">${esc(codice)}</div>
    <h3>${esc(p.cliente)}</h3>
    <div class="who">${esc(p.immobile||'ubicazione non indicata')}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 4px">
      <span class="tag"><span class="prio v${p.prio||4}" style="width:16px;height:16px;font-size:9px">${p.prio||4}</span> priorità</span>
      ${p._cats.map(c=>`<span class="tag">${catDot(c)}${CATNAME[c]}</span>`).join('')}
      <span class="tag st ${statoClass(p.stato)}">${esc((p.stato||'').toLowerCase())}</span>
    </div>
    ${p.azione?`<div class="box"><div class="k">Prossima azione</div>${esc(p.azione)}</div>`:''}
    ${p.attesadi?`<div class="box ${p._att>14?'bad':'warn'}"><div class="k">In attesa${p._att!=null?' da '+p._att+' giorni':''}</div>${esc(p.attesadi)}${p.dachi?'<br><b>da:</b> '+esc(p.dachi):''}</div>`:''}
    <dl style="margin:16px 0 0">
      ${fld('Dettaglio',p.dettaglio)}
      ${fld('Cartella',p.cartella)}
      ${fld('Contatto',p.contattare)}
      ${fld('Scadenza',p.scadenza)}
      ${fld('Attesa dal',p.attesadal)}
      ${fld('Ultimo contatto',p.ultimocontatto)}
      ${fld('Onorario',p.onorario)}
      ${fld('Pagamento',p.pagam)}
    </dl>
    ${p.note?`<div class="box"><div class="k">Note operative</div>${esc(p.note)}</div>`:''}
    <div class="schedaz" style="margin-top:16px"><button class="act pri" id="vaicliente">Apri la scheda di ${esc(p.cliente)}</button>${(String(p.cat||'').split(/[^A-Z]+/).includes('CAN')||esisteCantiere(p.cliente,p.id))?`<button class="act" id="vaicantiere">Apri il cantiere</button>`:''}</div>`;
  const vcan=D.querySelector('#vaicantiere');
  if(vcan) vcan.onclick=()=>{ setView('can');
    try{ if(window.CANT&&window.CANT[p.id]) CA.apri(p.id); else CA.daCliente(p.cliente); }catch(e){} };
  const vc2=D.querySelector('#vaicliente');
  if(vc2) vc2.onclick=()=>{
    const cl=DATA.clienti.find(x=>norm(x.cliente)===norm(p.cliente))
      || DATA.clienti.find(x=>x.cartella && p.cartella && x.cartella.trim()===p.cartella.trim());
    if(!cl){ toast('Questo cliente non è ancora in anagrafica'); return; }
    state.csel=cl._i; setView('home'); render();
  };
}

function esisteCantiere(nome, id){
  try{
    const C=window.CANT||{};
    if(id && C[id]) return true;
    const n=String(nome||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
    if(!n) return false;
    return Object.keys(C).some(function(k){
      if(k.indexOf("cli:")!==0) return false;
      const v=k.slice(4).toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
      return v===n || v.indexOf(n)>=0 || n.indexOf(v)>=0;
    });
  }catch(e){ return false; }
}
window.esisteCantiere=esisteCantiere;

/* ---------- scrivania a tre zone ---------- */
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const DOW=['lun','mar','mer','gio','ven','sab','dom'];

state.urgf = null; state.calSel = null; state.isel = null; state.alf = null; state.notaMod = null; state.notaCanc = null;
let OVR={}, AZ={}, CH={}, DIA={}, OVA={}, FAS={}, VIS={}, IMM={}, LAV={}, CSEL={}, ARCH={}, DB=null;

var __fotoMancanti=[];
function saveLocal(){ try{ localStorage.setItem('urg-ovr', JSON.stringify(OVR)); localStorage.setItem('urg-az', JSON.stringify(AZ)); localStorage.setItem('urg-ch', JSON.stringify(CH)); localStorage.setItem('urg-dia', JSON.stringify(DIA)); localStorage.setItem('urg-ova', JSON.stringify(OVA)); localStorage.setItem('urg-fas', JSON.stringify(FAS)); localStorage.setItem('urg-vis', JSON.stringify(VIS)); localStorage.setItem('urg-imm', JSON.stringify(IMM)); localStorage.setItem('urg-lav', JSON.stringify(LAV)); localStorage.setItem('urg-csel', JSON.stringify(CSEL)); localStorage.setItem('urg-arch', JSON.stringify(ARCH)); }catch(e){}
  try{ localStorage.setItem('urg-cant', JSON.stringify(smontaFoto(CANT).dati)); window.CANTOK=true; }catch(e){ window.CANTOK=false; } }
const ECO={};
function copiaLibera(v){ try{ return JSON.parse(JSON.stringify(v)); }catch(e){ return v; } }

/* ---------- le foto stanno fuori dal documento dei cantieri ----------
   Un documento di archivio ha un tetto di un megabyte, e le foto lo
   sfonderebbero in fretta. Quindi nel documento resta un riferimento,
   "@foto/...", e la foto vera sta in un documento suo. In memoria e sullo
   schermo l'app continua a vedere la foto come prima. */
var FOTO={}, FOTOCHIESTE={}, FOTOSCRITTE={};
function chiaveFoto(can, lid, i){
  return 'foto/'+String(can+'--'+lid+'--'+(i==null?'p':i)+'--'+
    Math.random().toString(36).slice(2,8)).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_');
}
function chiaveBuona(k){ return typeof k==='string' && k.indexOf('foto/')===0; }
function fotoDaCasa(k){
  if(FOTO[k]) return FOTO[k];
  try{ var v=localStorage.getItem('fo-'+k); if(v){ FOTO[k]=v; return v; } }catch(e){}
  return null;
}
function fotoInCasa(k, src){
  if(FOTO[k]===src) return;
  FOTO[k]=src;
  try{ localStorage.setItem('fo-'+k, src); }catch(e){}
}
function smontaFoto(cant){
  var fuori=[], out={};
  Object.keys(cant||{}).forEach(function(can){
    var c=cant[can]; if(!c||typeof c!=='object'){ out[can]=c; return; }
    var c2={}, k; for(k in c) c2[k]=c[k];
    if(Array.isArray(c.lav)) c2.lav=c.lav.map(function(l){
      var l2={}, j; for(j in l) l2[j]=l[j];
      if(typeof l.fsrc==='string' && l.fsrc.indexOf('data:')===0){
        /* la chiave nasce una volta e resta attaccata alla foto, cosi'
           se cambi l'ordine o sostituisci lo scatto non si mescolano */
        var k1 = chiaveBuona(l.fk) ? l.fk : chiaveFoto(can,l.id,null);
        l.fk = k1; l2.fk = k1;
        fotoInCasa(k1,l.fsrc); fuori.push([k1,l.fsrc]); l2.fsrc='@'+k1;
      }
      if(Array.isArray(l.gal)) l2.gal=l.gal.map(function(g,i){
        if(g && typeof g.src==='string' && g.src.indexOf('data:')===0){
          var k2 = chiaveBuona(g.k) ? g.k : chiaveFoto(can,l.id,i);
          g.k = k2;
          fotoInCasa(k2,g.src); fuori.push([k2,g.src]);
          var g2={}, q; for(q in g) g2[q]=g[q]; g2.k=k2; g2.src='@'+k2; return g2;
        }
        return g;
      });
      return l2;
    });
    out[can]=c2;
  });
  return {dati:out, fuori:fuori};
}
function rimontaFoto(cant){
  var mancanti=[];
  Object.keys(cant||{}).forEach(function(can){
    var c=cant[can]; if(!c||!Array.isArray(c.lav)) return;
    c.lav.forEach(function(l){
      if(typeof l.fsrc==='string' && l.fsrc.charAt(0)==='@'){
        var k=l.fsrc.slice(1), v=fotoDaCasa(k);
        if(v) l.fsrc=v; else if(mancanti.indexOf(k)<0) mancanti.push(k);
      }
      (l.gal||[]).forEach(function(g){
        if(g && typeof g.src==='string' && g.src.charAt(0)==='@'){
          var k2=g.src.slice(1), v2=fotoDaCasa(k2);
          if(v2) g.src=v2; else if(mancanti.indexOf(k2)<0) mancanti.push(k2);
        }
      });
    });
  });
  return mancanti;
}
function rimettiFoto(k, src){
  var rif='@'+k;
  Object.keys(CANT||{}).forEach(function(can){
    var c=CANT[can]; if(!c||!Array.isArray(c.lav)) return;
    c.lav.forEach(function(l){
      if(l.fsrc===rif) l.fsrc=src;
      (l.gal||[]).forEach(function(g){ if(g&&g.src===rif) g.src=src; });
    });
  });
  clearTimeout(rimettiFoto._t);
  rimettiFoto._t=setTimeout(function(){ try{ if(window.CA&&CA.render) CA.render(); }catch(e){} }, 400);
}
function chiediFoto(chiavi){
  if(!DB||!chiavi||!chiavi.length) return;
  chiavi.forEach(function(k){
    if(FOTOCHIESTE[k]) return; FOTOCHIESTE[k]=1;
    try{
      DB.doc(k).get().then(function(sn){
        var d=(sn&&sn.exists)?sn.data():null;
        if(d&&d.v){ fotoInCasa(k,d.v); rimettiFoto(k,d.v); }
      }).catch(function(){ delete FOTOCHIESTE[k]; });
    }catch(e){ delete FOTOCHIESTE[k]; }
  });
}
try{ __fotoMancanti = rimontaFoto(CANT); }catch(e){ __fotoMancanti=[]; }

function scrivi(doc, val){
  ECO[doc]=Date.now();
  saveLocal();
  if(!DB) return;
  if(doc==='stato/cantieri'){
    const sm=smontaFoto(val);
    sm.fuori.forEach(function(par){
      var k=par[0], src=par[1];
      if(FOTOSCRITTE[k]===src.length) return;   /* gia' scritta, identica */
      FOTOSCRITTE[k]=src.length;
      DB.doc(k).set({v:src}).catch(function(){ delete FOTOSCRITTE[k]; });
    });
    DB.doc(doc).set({v:sm.dati}).catch(()=>{});
    return;
  }
  DB.doc(doc).set({v:val}).catch(()=>{});
}

function praticheDi(c){ if(c&&c._prat&&c._prat.length) return c._prat;
  const n=(c&&c.cliente)||c; return DATA.pratiche.filter(p=>p.cliente===n); }
function pesoLeggibile(n){ return n<1024?n+' B' : n<1048576?(n/1024).toFixed(0)+' KB' : (n/1048576).toFixed(1)+' MB'; }
function pacchettoScheda(c){
  const nome=c.cliente;
  const prat=praticheDi(c);
  const ids=prat.map(p=>String(p.id));
  const fasi={}; ids.forEach(id=>{ if(FAS[id]!=null) fasi[id]=FAS[id]; });
  const cantieri={}; ids.forEach(id=>{ if(window.CANT && CANT[id]) cantieri[id]=CANT[id]; });
  const allerte={}; Object.keys(ARCH).forEach(k=>{ if(k.split('|')[1]===nome) allerte[k]=ARCH[k]; });
  const nl=String(nome).toLowerCase();
  const immobili={}; Object.keys(IMM).forEach(k=>{ if(String(k).toLowerCase().indexOf(nl)>=0) immobili[k]=IMM[k]; });
  const immagini={}; let peso=0, nimg=0;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i)||'';
      if(k.indexOf('can-img-')!==0) continue;
      const resto=k.slice(8), id=resto.slice(0, resto.indexOf('-')<0?resto.length:resto.indexOf('-'));
      if(ids.indexOf(id)<0) continue;
      const v=localStorage.getItem(k); if(!v) continue;
      immagini[k]=v; peso+=v.length; nimg++;
    }
  }catch(e){}
  return {app:'Studio Sozzo', tipo:'backup scheda cliente', versione:1,
    cliente:nome, salvato:new Date().toISOString(),
    pratiche:prat, urgenza:OVR[nome]||null, azione:AZ[nome]||null, chiusura:CH[nome]||null,
    diario:DIA[nome]||[], campi:OVA[nome]||null, lavorazioni:LAV[nome]||null, categorie:CSEL[nome]||null,
    fasi:fasi, cantieri:cantieri, allerte:allerte, immobili:immobili,
    immagini:immagini, conteggi:{pratiche:prat.length, aggiornamenti:(DIA[nome]||[]).length, immagini:nimg, pesoImmagini:peso}};
}
function riassuntoScheda(c){
  const q=pacchettoScheda(c).conteggi;
  const v=[q.pratiche+' pratic'+(q.pratiche===1?'a':'he'), q.aggiornamenti+' aggiornamenti'];
  const ids=praticheDi(c).map(p=>String(p.id));
  let lav=0, ck=0, ev=0;
  ids.forEach(id=>{ const x=(window.CANT&&CANT[id])||null; if(!x) return;
    lav+=(x.lav||[]).length; ck+=(x.ck||[]).filter(y=>y.e).length; ev+=(x.ev||[]).length; });
  if(lav) v.push(lav+' lavorazioni di cantiere');
  if(ck) v.push(ck+' voci di cantierizzazione');

  v.push(q.immagini+' fra foto e planimetrie'+(q.immagini?' ('+pesoLeggibile(q.pesoImmagini)+')':''));
  return v.join(' · ');
}
function nomeChiave(nome){
  const w=String(nome||'').replace(/[^A-Za-zÀ-ÿ' ]/g,' ').split(/\s+/).filter(x=>x.length>2);
  return w.length?w[w.length-1]:String(nome||'').trim();
}
async function cartellaCliente(nome){
  const chiave=nomeChiave(nome);
  if(chiave){
    try{
      const r=await MCP.callTool('Google Drive','search_files',{
        query:"title contains '"+chiave.replace(/'/g,"\\'")+"' and mimeType = 'application/vnd.google-apps.folder'",
        pageSize:5, excludeContentSnippets:true});
      const f=(r&&r.payload&&r.payload.files)||[];
      if(f.length && f[0].id) return {id:f[0].id, nome:f[0].title||chiave, nuova:false};
    }catch(e){ if(e&&e.code==='needs_reauth') throw e; }
  }
  const r2=await MCP.callTool('Google Drive','create_file',{
    title:String(nome).replace(/[\\/]/g,'-'), parentId:DRIVE_CLIENTI,
    contentMimeType:'application/vnd.google-apps.folder'});
  const pl=(r2&&r2.payload)||{};
  if(!pl.id) throw {code:'tool_error', message:'cartella non creata'};
  return {id:pl.id, nome:pl.title||nome, nuova:true};
}
function messaggioDrive(e){
  const k=e&&e.code;
  if(k==='needs_reauth') return 'Google Drive chiede di ricollegare l’account. Aprilo dalle impostazioni di Claude e riprova.';
  if(k==='server_not_connected') return 'Google Drive non risulta collegato a questa finestra.';
  if(k==='blocked_by_policy') return 'Il collegamento a Google Drive è bloccato dalle impostazioni.';
  if(k==='rate_limited') return 'Google Drive ha rifiutato per troppe richieste. Riprova fra un minuto.';
  if(k==='server_unavailable'||k==='upstream_error') return 'Google Drive non ha risposto. Potrebbe aver salvato lo stesso: controlla la cartella prima di rifare il backup.';
  return 'Non sono riuscito a salvare il backup su Drive.';
}

function suggerita(c){
  const ap=c._ap||[];
  if(!ap.length) return {v:4, why:'nessuna pratica aperta'};
  const att=Math.max(...ap.map(p=>p._att==null?-1:p._att));
  const regPrio=Math.min(...ap.map(p=>+p.prio||4));
  const scad=ap.filter(p=>p.scadenza).map(p=>Math.round((new Date(p.scadenza+'T00:00:00')-TODAY)/86400000));
  const gg=scad.length?Math.min(...scad):null;
  if(gg!=null && gg<=7) return {v:1, why:`scadenza tra ${gg} giorni`};
  if(att>30) return {v:1, why:`ferma da ${att} giorni, oltre il mese`};
  if(regPrio===1) return {v:1, why:'segnata priorità 1 nel registro'};
  if(gg!=null && gg<=30) return {v:2, why:`scadenza tra ${gg} giorni`};
  if(att>14) return {v:2, why:`ferma da ${att} giorni`};
  if(regPrio===2) return {v:2, why:'segnata priorità 2 nel registro'};
  if(att>=0) return {v:3, why:`in attesa da ${att} giorni`};
  if(regPrio===3) return {v:3, why:'segnata priorità 3 nel registro'};
  return {v:4, why:'nessuna attesa e nessuna scadenza'};
}

function ricalcolaUrgenze(){
  DATA.clienti.forEach(c=>{
    const ap=c._prat.filter(p=>!/CHIUS|CONCLUS/i.test(p.stato||''));
    let att=Math.max(...ap.map(p=>p._att==null?-1:p._att), -1);

    if(ov&&ov.attesadal){ const g=days(ov.attesadal); if(g!=null) att=g; }
    Object.assign(c,{_ap:ap,_maxatt:att});
    const u=urgOf(c);
    Object.assign(c,{_prio:u.val,_sug:u.sug,_why:u.why,_mod:u.mod});
  });
}

    const ov=OVA[c.cliente];
    if(ov&&ov.attesadal){ const g=days(ov.attesadal); if(g!=null) att=g; }

  DATA.clienti.forEach(c=>{
    if(statoCh(c.cliente)) return;
    const ap=c._ap||[];
    const mie=(postaCli.get(c._i)||[]).sort((a,b)=>String(b.data).localeCompare(String(a.data)));
    const ultima=mie[0];
    const gg = ultima ? ggDa(ultima.data) : null;
    const agg=(DIA[c.cliente]||[]);
    const ultimoAgg=agg.length?ggDa(agg[0].d||agg[0].data):null;
    const push=(k,perche,g,rif)=>{
      if(archiviata(k, c.cliente, rif||'')) return;
      out[k].push({i:c._i, cliente:c.cliente, perche, gg:g, rif:rif||''});
    };

    const rifMail = ultima ? String(ultima.data||'') : '';
    if(ultima && RX_SOLLECITO.test((ultima.sogg||'')+' '+(ultima.snip||'')))
      push('sollecito','"'+String(ultima.sogg||'').slice(0,60)+'" del '+String(ultima.data||'').slice(0,10), gg, rifMail);
    else if(ultima && RX_OK.test(ultima.snip||''))
      push('ok','ha confermato il '+String(ultima.data||'').slice(0,10), gg, rifMail);
    else if(ultima && gg!=null && gg>7 && (ultimoAgg==null || ultimoAgg>gg))
      push('muta','ultima sua email '+gg+' giorni fa, nessun aggiornamento tuo dopo', gg, rifMail);

    if(ap.length){
      if(c._maxatt!=null && c._maxatt>30) push('ferma','ferma da '+c._maxatt+' giorni', c._maxatt);
      ap.forEach(p=>{
        if(p.scadenza){ const d=Math.round((new Date(p.scadenza+'T00:00:00')-TODAY)/86400000);
          if(d<=7) push('scade', (d<0?('scaduta da '+(-d)+' giorni'):('scade fra '+d+' giorni'))+': '+String(p.dettaglio||'').slice(0,50), d); }
        if(String(p.azione||'').toLowerCase().includes('impegno scaduto'))
          push('promessa', String(p.azione).slice(0,90), c._maxatt);
      });
      if(!c._folder) push('cartella','pratica attiva senza cartella in archivio', null);
    }
  });
  Object.keys(out).forEach(k=>{
    const visti=new Set();
    out[k]=out[k].filter(x=>{ if(visti.has(x.i)) return false; visti.add(x.i); return true; })
                 .sort((a,b)=>(b.gg==null?-1:b.gg)-(a.gg==null?-1:a.gg));
  });
  ALLERTE=out; return out;
}

const FASI={
  RIL:['incarico','sopralluogo e presa punti','elaborazione nuvola','restituzione grafica','consegna','chiusa'],
  CAT:['incarico','visure e documenti','predisposizione DOCFA','deposito','esito e ricevute','chiusa'],
  URB:['incarico','verifica stato legittimo','elaborati','deposito','protocollata','integrazioni','conclusa'],
  DD :['incarico','sopralluogo','accesso agli atti','verifica conformità','relazione','consegna','chiusa'],
  CAN:['preventivo','incarico','apertura cantiere','lavori in corso','fine lavori','collaudo e consegna','chiusa'],
  SOP:['richiesta','appuntamento fissato','eseguito','scheda consegnata','chiusa']
};
function catDi(p){ return (p._cats&&p._cats[0]) || 'URB'; }
function faseDi(p){
  const lista=FASI[catDi(p)];
  if(FAS[p.id]!=null && FAS[p.id]<lista.length) return +FAS[p.id];
  const st=(p.stato||'').toUpperCase();
  if(st==='DA AVVIARE') return 0;
  if(st==='IN LAVORAZIONE') return Math.min(2, lista.length-2);
  if(st==='INTEGRAZIONI'){ const i=lista.indexOf('integrazioni'); return i>=0?i:lista.length-2; }
  if(st==='IN ATTESA') return 1;
  return 0;
}

  const sr=D.querySelector('#s-riapri');
  if(sr) sr.onclick=()=>{ delete CH[c.cliente]; saveCh(); toast(c.cliente+': riaperta'); render(); };
  [...D.querySelectorAll('[data-fase]')].forEach(b=>b.onclick=()=>{

    const p=DATA.pratiche.find(x=>String(x.id)===pid);

    const campoEx=()=>comp.querySelector('#c-ex')?comp.querySelector('#c-ex').value.trim():'';
    const dettaStato=(t)=>{ if(stato) stato.textContent=t; };

    const salvaBozza=()=>{
      if(finito) return;

      const ex=campoEx();

      if(idxBozza==null){ lista.push({t:state.tipo, txt, extra:ex, data:oggiISO(), ora}); idxBozza=lista.length-1; }
      else { lista[idxBozza]={t:state.tipo, txt, extra:ex, data:oggiISO(), ora:lista[idxBozza].ora||ora}; }
      OVA[c.cliente]=OVA[c.cliente]||{};
      if(state.tipo==='azione') OVA[c.cliente].azione=txt;
      else if(state.tipo==='attesa') Object.assign(OVA[c.cliente], {attesadi:txt, dachi:ex, attesadal:oggiISO()});
      try{ saveDia(); saveOva(); dettaStato('salvato alle '+ora); }
      catch(e){ dettaStato('salvato qui, sincronizzazione non riuscita'); }
    };
    const chiudiNota=()=>{
      if(tSalva){ clearTimeout(tSalva); tSalva=null; }
      const txt=comp.querySelector('#c-txt').value.trim();
      if(!txt){ return; }
      salvaBozza();
      finito=true;
      const ta=comp.querySelector('#c-txt'); if(ta) ta.value='';
      const tipoEra=state.tipo; idxBozza=null;
      if(tipoEra==='azione') toast('Prossima azione aggiornata');
      else if(tipoEra==='attesa') toast('Segnata in attesa da oggi');
      state.flash=1; render();
    };

    comp.querySelector('#c-txt').addEventListener('input', ()=>{
      dettaStato('sto salvando…');
      if(tSalva) clearTimeout(tSalva);
      tSalva=setTimeout(salvaBozza, 700);

    comp.addEventListener('change', e=>{ if(e.target.id==='c-ex') salvaBozza(); });
    comp.querySelector('#c-txt').addEventListener('blur', ()=>{ if(tSalva){clearTimeout(tSalva);} salvaBozza(); });
    comp.querySelector('#c-txt').addEventListener('keydown', e=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); chiudiNota(); }
    });
  }
}

const COMUNI_NOTI=/^(lecce|monteroni|arnesano|carpignano|martano|squinzano|calimera|frigole|san cataldo|san donato|carmiano|racale|morciano|castrignano|muro leccese|mancaversa|san pietro in lama|bari|sternatia|copertino|nardo|galatina|melendugno|vernole|caprarica|lequile|surbo|trepuzzi|novoli|veglie|salice|guagnano|campi|cavallino|lizzanello|acaya|otranto|maglie|tricase|gallipoli|casarano|ugento|presicce|specchia|alessano|corsano|tiggiano|nociglia|scorrano|cursi|melpignano|zollino|soleto|sogliano|cannole|giurdignano|uggiano|poggiardo|ortelle|castro|santa cesarea|minervino|giuggianello|sanarica|botrugno|san cassiano|supersano|ruffano|taurisano|acquarica|salve|morciano di leuca|patu|castrignano del capo|gagliano|montesano|miggiano|montesardo|andrano|diso|spongano|surano|maruggio|manduria|taranto|brindisi)\b/i;
function ripulisci(t){ return String(t||'').replace(/\s+/g,' ').trim().replace(/^[,;.\-\s]+|[,;.\-\s]+$/g,''); }
function comuneDi(t){
  const primo=ripulisci(String(t).split(',')[0]);
  return primo.replace(/\s*\([A-Z]{2}\)\s*$/,'').trim();
}
function chiaveImm(t){ return norm(t); }
function costruisciImmobili(){
  const mappa=new Map();
  const aggiungi=(testo, cliIdx, pratId)=>{
    const t=ripulisci(testo);
    if(!t) return;
    if(/^(n\/?d|nd|da definire|non indicat)/i.test(t)) return;
    const k=chiaveImm(t); if(!k) return;
    if(!mappa.has(k)) mappa.set(k, {k, testo:t, comune:comuneDi(t), clienti:new Set(), pratiche:new Set()});
    const o=mappa.get(k);
    if(t.length>o.testo.length) o.testo=t;
    if(cliIdx!=null) o.clienti.add(cliIdx);
    if(pratId!=null) o.pratiche.add(pratId);
  };
  const pezzi = t => String(t||'').split(';').map(ripulisci).filter(Boolean);
  DATA.clienti.forEach(c=>{ pezzi(c.immobile).forEach(t=>aggiungi(t, c._i, null)); });
  DATA.pratiche.forEach(p=>{
    const cl=DATA.clienti.find(c=>norm(c.cliente)===norm(p.cliente));
    const list=pezzi(p.immobile);
    if(list.length) list.forEach(t=>aggiungi(t, cl?cl._i:null, p.id));
    else if(cl) pezzi(cl.immobile).forEach(t=>aggiungi(t, cl._i, p.id));
  });
  /* fonde le scritture diverse dello stesso immobile:
     "Via Roma 1" dentro "Lecce, Via Roma 1" */
  const voci=[...mappa.values()].map(o=>({o, par:new Set(o.k.split(' ').filter(Boolean))}));
  voci.sort((a,b)=>a.par.size-b.par.size);
  voci.forEach((v,ix)=>{
    if(v.assorbita || v.par.size<2) return;
    const cand=voci.filter((w,iy)=>iy!==ix && !w.assorbita && w.par.size>v.par.size
      && [...v.par].every(x=>w.par.has(x)));
    if(cand.length!==1) return;
    const dest=cand[0].o;
    v.o.clienti.forEach(x=>dest.clienti.add(x));
    v.o.pratiche.forEach(x=>dest.pratiche.add(x));
    v.assorbita=true; mappa.delete(v.o.k);
  });
  const arr=[...mappa.values()].map(o=>({
    k:o.k, testo:o.testo, comune:o.comune||'comune non indicato',
    clienti:[...o.clienti], pratiche:[...o.pratiche]
  }));
  arr.sort((a,b)=> a.comune.localeCompare(b.comune) || a.testo.localeCompare(b.testo));
  return arr;
}
let IMMOBILI=[];
function catastoDalTesto(t){
  const s=String(t||'');
  const f=s.match(/f(?:g|oglio)\.?\s*n?\.?\s*(\d{1,4})/i);
  const p=s.match(/p(?:\.?\s?lla|articella|\.lle)\.?\s*n?\.?\s*([\d]{1,5}(?:\s*[\-\/]\s*\d{1,5})?)/i);
  const sb=s.match(/sub\.?\s*n?\.?\s*(\d{1,4})/i);
  return {foglio:f?f[1]:'', part:p?p[1].replace(/\s+/g,''):'', sub:sb?sb[1]:''};
}
function datiImm(k){ if(!IMM[k]) IMM[k]={}; return IMM[k]; }
function immPieno(k){ const d=IMM[k]||{}; return !!(d.foglio||d.part||d.sub||d.titoli||d.note); }
function immobiliDi(cliIdx){ return IMMOBILI.filter(i=>i.clienti.includes(cliIdx)); }

function renderImm(){
  if(!IMMOBILI.length) IMMOBILI=costruisciImmobili();
  const q=state.q;

/* ---------- lavorazioni per categoria ---------- */
const CATLAV=[
  {k:'URB', n:'Urbanistica',   col:'--c-urb', tipi:['CILA','SCIA','PDC','CILAS','Sanatoria','Agibilita','Altro']},
  {k:'CAT', n:'Catasto',       col:'--c-cat', tipi:['DOCFA','Frazionamento','Verifica catastale','Tipo mappale','Voltura','Altro']},
  {k:'RIL', n:'Rilievi',       col:'--c-ril', tipi:['Drone','Laser scanner','Rilievo diretto','Restituzione grafica','Altro']},
  {k:'CAN', n:'Cantiere',      col:'--c-can', tipi:['Direzione lavori','Coordinamento sicurezza','Contabilita','Computo metrico','Fine lavori','Altro']},
  {k:'DD',  n:'Due diligence', col:'--c-dd',  tipi:['Accesso agli atti','Verifica conformita','Relazione','Altro']}
];
const CATLAVMAP=Object.fromEntries(CATLAV.map(c=>[c.k,c]));
const STATILAV=['da avviare','in corso','depositata','in attesa','conclusa'];

function lavDi(nome){ return LAV[nome]||{}; }
function lavCat(nome,k){ const o=lavDi(nome); return Object.keys(o).filter(id=>o[id].cat===k).map(id=>Object.assign({id},o[id])); }
function nLav(nome,k){ return lavCat(nome,k).length; }
function nuovoIdLav(){ return 'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }

function catAttiva(nome,k){ return (CSEL[nome]||[]).includes(k) || nLav(nome,k)>0; }
function attivaCat(nome,k){
  if(!CSEL[nome]) CSEL[nome]=[];
  if(!CSEL[nome].includes(k)) CSEL[nome].push(k);
  saveCsel();
}
function togliCat(nome,k){
  if(CSEL[nome]) CSEL[nome]=CSEL[nome].filter(x=>x!==k);
  saveCsel();
}
function barraCategorie(c, piccola){
  const voci = piccola ? CATLAV.filter(x=>catAttiva(c.cliente,x.k)) : CATLAV;
  if(piccola && !voci.length) return '';
  return `<span class="catbar ${piccola?'catmini':''}">${voci.map(x=>{
    const n=nLav(c.cliente,x.k), on=catAttiva(c.cliente,x.k);
    return `<span class="catwrap"><button class="catbtn c-${x.k} ${on?'pieno':'spento'}" data-lav="${c._i}:${x.k}"
      title="${x.n}${n?' · '+n+' lavorazioni registrate':(on?' · categoria scelta, nessuna lavorazione ancora':' · premi per assegnarla a questo cliente')}">
      ${piccola?x.k:x.n}${n?`<span class="cn">${n}</span>`:''}</button>${(!piccola && on && !n)?
        `<button class="catx" data-catx="${c._i}:${x.k}" title="togli questa categoria dal cliente">×</button>`:''}</span>`;}).join('')}</span>`;
}


/* ---------- finestra della lavorazione ---------- */
function chiudiModale(){ const m=document.getElementById('modale'); if(m) m.remove(); }
function apriLavorazioni(cliIdx, k, idApri){
  const c=DATA.clienti.find(x=>x._i===cliIdx); if(!c) return;
  const cat=CATLAVMAP[k]; if(!cat) return;
  chiudiModale();
  const wrap=document.createElement('div');
  wrap.id='modale'; wrap.className='modale';
  wrap.innerHTML=`<div class="mbox c-${k}">
    <div class="mtop">
      <span class="mtag c-${k}">${esc(cat.n)}</span>
      <span class="mtit">${esc(c.cliente)}</span>
      ${(k==='CAN'||esisteCantiere(c.cliente))?`<button class="act pri" id="mcantiere" style="background:#1668DC;border-color:#1668DC">Apri il cantiere</button>`:''}
      <button class="act" id="mchiudi">chiudi</button>
    </div>
    <div class="mbody" id="mbody"></div>
  </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('mousedown', e=>{ if(e.target===wrap) chiudiModale(); });
  document.getElementById('mchiudi').onclick=chiudiModale;
  const mcan=document.getElementById('mcantiere');
  if(mcan) mcan.onclick=()=>{ chiudiModale(); try{ setView('can'); CA.daCliente(c.cliente); }catch(e){} };
  state.lavApri = idApri || null;
  dipingiModale(c, cat);
}

function dipingiModale(c, cat){
  const B=document.getElementById('mbody'); if(!B) return;
  const el=lavCat(c.cliente, cat.k).sort((a,b)=>String(b.agg||'').localeCompare(String(a.agg||'')));
  const apri=state.lavApri;
  const dataLbl = cat.k==='RIL' ? 'Data esecuzione' : (cat.k==='CAN' ? 'Data inizio' : 'Data presentazione');
  const numLbl  = cat.k==='CAT' ? 'Numero pratica' : (cat.k==='RIL' ? 'Numero file o cartella' : 'Protocollo o numero');
  const form=(l)=>{
    const d=l||{tipo:cat.tipi[0], stato:'da avviare'};
    const id=l?l.id:'nuova';
    return `<div class="mform" data-form="${id}">
      <div class="mgrid">
        <label class="immf"><span>Tipo di lavorazione</span>
          <select data-lf="tipo">${cat.tipi.map(t=>`<option ${d.tipo===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
        <label class="immf"><span>Stato</span>
          <select data-lf="stato">${STATILAV.map(t=>`<option ${d.stato===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
        <label class="immf"><span>${numLbl}</span><input data-lf="num" value="${esc(d.num||'')}" placeholder="es. 1657/2025"></label>
        <label class="immf"><span>${dataLbl}</span><input data-lf="data" type="date" value="${esc(d.data||'')}"></label>
        <label class="immf"><span>Scadenza o controllo</span><input data-lf="scad" type="date" value="${esc(d.scad||'')}"></label>
        <label class="immf"><span>Onorario €</span><input data-lf="euro" value="${esc(d.euro||'')}" placeholder="es. 1.200"></label>
      </div>
      <label class="immf largo"><span>Oggetto</span>
        <input data-lf="ogg" value="${esc(d.ogg||'')}" placeholder="Cosa riguarda questa lavorazione"></label>
      <label class="immf largo"><span>Informazioni e note</span>
        <textarea data-lf="note" rows="4" placeholder="Ufficio, referente, documenti mancanti, cosa resta da fare">${esc(d.note||'')}</textarea></label>
      <div class="mact">
        <button class="act pri" data-salva="${id}">Salva</button>
        <button class="act" data-annulla="1">Annulla</button>
        ${l?`<button class="act mdel" data-elimina="${l.id}">Elimina</button>`:''}
        <span class="msp" id="msp"></span>
      </div>
    </div>`;
  };
  B.innerHTML=`
    ${el.length?`<div class="mlist">${el.map(l=>`
      <div class="mrow ${apri===l.id?'aperta':''}" data-riga="${l.id}">
        <div class="mrh">
          <span class="mtipo c-${cat.k}">${esc(l.tipo||'')}</span>
          <span class="mogg">${esc(l.ogg||'senza oggetto')}</span>
          <span class="mstato s-${(l.stato||'').replace(/\s/g,'-')}">${esc(l.stato||'')}</span>
          <button class="act" data-mod="${l.id}">${apri===l.id?'chiudi':'modifica'}</button>
        </div>
        <div class="mrd">${[l.num?'n. '+esc(l.num):'', l.data?'del '+esc(l.data):'', l.scad?'controllo il '+esc(l.scad):'', l.euro?esc(l.euro)+' €':''].filter(Boolean).join(' · ')||'nessun dato inserito'}</div>
        ${l.note?`<div class="mrn">${esc(l.note)}</div>`:''}
        ${apri===l.id?form(l):''}
      </div>`).join('')}</div>`
      :`<p class="empty" style="padding:6px 0 12px">Nessuna lavorazione di ${esc(cat.n.toLowerCase())} per questo cliente. Compila qui sotto e premi Salva.</p>`}
    ${apri&&apri!=='nuova'?'':`<div class="mnuova"><div class="mnh">Nuova lavorazione</div>${form(null)}</div>`}`;

  [...B.querySelectorAll('[data-mod]')].forEach(b=>b.onclick=()=>{
    state.lavApri = state.lavApri===b.dataset.mod ? null : b.dataset.mod; dipingiModale(c, cat);});
  [...B.querySelectorAll('[data-annulla]')].forEach(b=>b.onclick=()=>{
    state.lavApri=null; dipingiModale(c, cat);});
  [...B.querySelectorAll('[data-elimina]')].forEach(b=>b.onclick=()=>{
    const id=b.dataset.elimina;
    if(LAV[c.cliente]) delete LAV[c.cliente][id];
    saveLav(); state.lavApri=null; dipingiModale(c, cat);
    toast('lavorazione eliminata'); aggiornaDopoLav();});
  [...B.querySelectorAll('[data-salva]')].forEach(b=>b.onclick=()=>{
    const box=b.closest('.mform');
    const dati={cat:cat.k, agg:new Date().toISOString().slice(0,16).replace('T',' ')};
    [...box.querySelectorAll('[data-lf]')].forEach(el=>{ dati[el.dataset.lf]=el.value.trim?el.value.trim():el.value; });
    if(!LAV[c.cliente]) LAV[c.cliente]={};
    const id = b.dataset.salva==='nuova' ? nuovoIdLav() : b.dataset.salva;
    LAV[c.cliente][id]=Object.assign(LAV[c.cliente][id]||{}, dati);
    saveLav(); state.lavApri=null; dipingiModale(c, cat);
    toast(c.cliente+': lavorazione salvata'); aggiornaDopoLav();});
}
function aggiornaDopoLav(){
  if(state.view==='home') renderHome();
  else if(state.view==='cli') renderCli();
}
function riquadroLavorazioni(c){
  const tutte=Object.entries(lavDi(c.cliente)).map(([id,l])=>Object.assign({id},l));
  if(!tutte.length) return `<p class="empty" style="padding:6px 0">Nessuna lavorazione registrata. Usa i pulsanti colorati qui sopra per aggiungerne una.</p>`;
  return CATLAV.filter(x=>tutte.some(l=>l.cat===x.k)).map(x=>{
    const el=tutte.filter(l=>l.cat===x.k);
    return `<div class="lavgruppo c-${x.k}">
      <div class="lavh"><span class="mtag c-${x.k}">${esc(x.n)}</span><span class="lavn">${el.length}</span>
        <button class="act" data-lav="${c._i}:${x.k}">aggiungi o modifica</button></div>
      ${el.map(l=>`<div class="lavriga">
        <div class="lavr1"><span class="mtipo c-${x.k}">${esc(l.tipo||'')}</span>

          <span class="mstato s-${(l.stato||'').replace(/\s/g,'-')}">${esc(l.stato||'')}</span></div>
        <div class="mrd">${[l.num?'n. '+esc(l.num):'', l.data?'del '+esc(l.data):'', l.scad?'controllo il '+esc(l.scad):'', l.euro?esc(l.euro)+' €':''].filter(Boolean).join(' · ')||'nessun dato inserito'}</div>
        ${l.note?`<div class="mrn">${esc(l.note)}</div>`:''}
      </div>`).join('')}
    </div>`;
  }).join('');
}
document.addEventListener('click', function(ev){
  const t=ev.target; if(!t||!t.closest) return;
  const x=t.closest('[data-catx]');
  if(x){ ev.preventDefault(); ev.stopPropagation();
    const [i,k]=x.dataset.catx.split(':');
    const c=DATA.clienti.find(y=>y._i===+i); if(!c) return;
    togliCat(c.cliente,k); toast(c.cliente+': tolta la categoria '+CATLAVMAP[k].n.toLowerCase());
    aggiornaDopoLav(); return; }
  const b=t.closest('[data-lav]');
  if(b){ ev.preventDefault(); ev.stopPropagation();
    const [i,k]=b.dataset.lav.split(':');
    const c=DATA.clienti.find(y=>y._i===+i); if(!c) return;
    if(!catAttiva(c.cliente,k)){ attivaCat(c.cliente,k); aggiornaDopoLav(); }
    if(k==='CAN'){ chiudiModale(); try{ setView('can'); CA.daCliente(c.cliente); return; }catch(e){} }
    apriLavorazioni(+i, k); }
}, true);
document.addEventListener('click', function(ev){
  const t=ev.target; if(!t||!t.closest) return;
  const a=t.closest('[data-alf]');
  if(a){ ev.preventDefault();
    state.alf = state.alf===a.dataset.alf ? null : a.dataset.alf;
    state.csel=null; renderHome(); scrollTop0(); return; }
  if(t.closest('#radartutti')){ ev.preventDefault(); state.alf=null; renderHome(); return; }
  if(t.closest('#radarrimetti')){ ev.preventDefault(); rimettiTutte();

}, true);

/* ---------- nuovo contatto ---------- */
const MOTIVI=[['CAT','Catasto','--c-cat'],['URB','Urbanistica','--c-urb'],['DD','Due diligence','--c-dd'],
  ['RIL','Rilievo architettonico','--c-ril'],['CON','Consulenza','--c-sop'],['CAN','Cantiere','--c-can'],['ALT','Altro','']];
const URG=[['1','Urgente','u1'],['2','Da fare a breve','u2'],['3','Normale','u3'],['4','Quando capita','u4']];
const nuovo={motivi:new Set(), urg:'3', nome:'', comune:'', note:''};
function renderNew(){
  const V=document.getElementById('view-new');
  const cod=`2026-${String(DATA.pratiche.length+1).padStart(3,'0')}_${(nuovo.comune||'COMUNE').toUpperCase().replace(/\s+/g,'')}_${[...nuovo.motivi][0]||'CAT'}`;
  V.innerHTML=`
    <h2 class="sec">Nuovo contatto</h2>
    <div class="form">
      <span class="fl">Per cosa ti hanno contattato</span>
      <div class="wrapg" id="gmot">${MOTIVI.map(([k,n,v])=>`<button class="big-chip" aria-pressed="${nuovo.motivi.has(k)}">${v?`<i class="dot" style="background:var(${v})"></i>`:''}${n}</button>`).join('')}</div>
      <p style="font-size:13.5px;color:var(--muted);margin:9px 0 0">Si può selezionarne più di uno. Ogni motivo scelto diventa una pratica distinta, con il suo codice e il suo stato.</p>

      <span class="fl">Urgenza</span>
      <div class="wrapg" id="gurg">${URG.map(([k,n,c])=>`<button class="u-chip ${c}" aria-pressed="${nuovo.urg===k}">${n}</button>`).join('')}</div>

      <span class="fl">Cliente</span>
      <input id="nnome" value="${esc(nuovo.nome)}" placeholder="Cognome Nome, oppure ragione sociale">
      <span class="fl">Comune dell'immobile</span>
      <input id="ncom" value="${esc(nuovo.comune)}" placeholder="Lecce, Squinzano, Melendugno...">
      <span class="fl">Cosa ha chiesto</span>
      <textarea id="nnote" rows="3" placeholder="Due righe, anche buttate giù male">${esc(nuovo.note)}</textarea>

      <div class="preview">
        <div class="k">Premendo crea, succede questo</div>
        <ul>
          <li>${nuovo.motivi.size||1} pratic${nuovo.motivi.size>1?'he':'a'} nuov${nuovo.motivi.size>1?'e':'a'}, la prima con codice <code>${esc(cod)}</code></li>
          <li>Cartella creata sul PC sotto il cliente, con le sottocartelle già dentro</li>
          <li>Riga nel registro con priorità ${nuovo.urg} e stato da avviare</li>
          <li>Etichetta Gmail <code>Pratiche/2026-${String(DATA.pratiche.length+1).padStart(3,'0')}</code>, e le email di questo cliente ci finiscono da sole</li>
          ${nuovo.urg==='1'?'<li>Promemoria sul calendario per domani mattina, perché è urgente</li>':''}
        </ul>
      </div>
      <div class="wrapg" style="margin-top:18px">
        <button class="u-chip u3" style="background:var(--accent);border-color:var(--accent);color:var(--on-accent)">Crea</button>
      </div>
      <p style="font-size:13px;color:var(--muted);margin-top:10px">In questo prototipo il pulsante non crea niente davvero, serve a farti vedere il flusso.</p>
    </div>`;
  [...V.querySelectorAll('#gmot button')].forEach((b,i)=>b.onclick=()=>{
    const k=MOTIVI[i][0]; nuovo.motivi.has(k)?nuovo.motivi.delete(k):nuovo.motivi.add(k); renderNew();});
  [...V.querySelectorAll('#gurg button')].forEach((b,i)=>b.onclick=()=>{nuovo.urg=URG[i][0];renderNew();});
  ['nnome','ncom','nnote'].forEach((id,i)=>{
    const el=V.querySelector('#'+id);
    el.oninput=e=>{nuovo[['nome','comune','note'][i]]=e.target.value;};
    el.onblur=()=>renderNew();
  });
}

function setView(v){
  state.view=v;
  try{ document.body.setAttribute('data-vista', v); }catch(e){}
  try{ var _o=JSON.parse(localStorage.getItem('ui-pos')||'{}'); _o.v=v; localStorage.setItem('ui-pos',JSON.stringify(_o)); }catch(e){}
  ['home','prat','cli','imm','can','mail','rub','ord','age','new'].forEach(k=>document.getElementById('view-'+k).hidden = (k!==v));
  [...document.querySelectorAll('.views button[data-view]')].forEach(b=>b.setAttribute('aria-selected', b.dataset.view===v));
}
function render(){
  if(state.view==='home') renderHome();
  if(state.view==='prat'){ buildFilters(); renderList(); }
  if(state.view==='cli') renderCli();
  if(state.view==='imm') renderImm();
  if(state.view==='can'){ try{ CA.render(); }catch(e){} }
  if(state.view==='mail') renderMail();
  if(state.view==='rub') renderRub();
  if(state.view==='ord') renderOrd();
  if(state.view==='age') renderAge();
  if(state.view==='new') renderNew();
}
document.querySelectorAll('.views button[data-view]').forEach(b=>b.onclick=()=>{
  if(b.dataset.view==='home'){ vaiHome(); return; }
  setView(b.dataset.view); render();});
document.getElementById('newbtn').onclick=()=>{setView('new');render();};
(function(){
  const alt=document.getElementById('altrobtn'), fila=document.querySelector('.views');
  if(!alt||!fila) return;
  alt.onclick=function(e){
    e.stopPropagation();
    const aperta=fila.classList.toggle('aperta');
    alt.textContent = aperta ? 'Meno' : 'Altro';
  };
  fila.querySelectorAll('button[data-view]').forEach(function(b){
    b.addEventListener('click', function(){
      if(b.dataset.view!=='home' && b.dataset.view!=='can') return;
      fila.classList.remove('aperta'); alt.textContent='Altro';
    });
  });
})();
function vaiHome(){
  state.postaTutte=0;
  state.q=''; const qi=document.getElementById('q'); if(qi) qi.value='';
  state.csel=null; state.sel=null; state.calSel=null; state.urgf=null; state.urgTmp=null; state.alf=null;
  sbloccaOrdine();
  setView('home'); render(); scrollTop0();
}
document.getElementById('brandhome').onclick=vaiHome;
document.getElementById('q').addEventListener('input',e=>{
  state.q=e.target.value.trim().toLowerCase();
  if(state.view==='home'){ state.csel=null; state.pag=0; }
  render();
});
document.getElementById('bkbtn').onclick=()=>backupDrive(true);
aggiornaSpiaBackup();
(async()=>{
  try{
    MCP = await claude.use('mcp');
    aggiornaSpiaBackup();
    if(MCP) setTimeout(()=>{ if(statoBackup()!==oggiISO()) backupDrive(false); }, 6000);
    if(MCP){ sincronizzaPosta(); setInterval(sincronizzaPosta, 3600000); }
  }catch(e){}
})();
window.aggiornaSpiaDati = function(){
  const el=document.getElementById('src');
  if(el) el.textContent = DATA.pratiche.length+' pratiche · '+DATA.clienti.length+' clienti reali';
};
aggiornaSpiaDati();
var UIPOS=null; try{ UIPOS=JSON.parse(localStorage.getItem('ui-pos')||'null'); }catch(e){}
setView('home'); render();
</script>

  if(d) return '<img class="pimg" src="'+d+'" alt="">';
  chiediImg(p.id);
  return '<div style="position:absolute;inset:0;display:grid;place-items:center;color:#8CA0B0;font-size:13px;text-align:center;padding:20px">'+
    (window.DB?"Sto scaricando la tavola dal tuo archivio.<br>Se non compare, ricaricala dal pulsante Tavole."
      :"Tavola non piu in memoria.<br>Ricaricala dal pulsante Tavole.")+'</div>'; }
function chiaveImg(pid){ return "can-img-"+S.can+"-"+pid; }
function chiaveDbImg(can,pid){ return "tavole/"+String(can+"--"+pid).replace(/[^A-Za-z0-9_\-.~:@+]/g,"_"); }
function leggiImg(pid){ try{ const v=localStorage.getItem(chiaveImg(pid)); if(v) IMG[S.can+"/"+pid]=v; return v; }catch(e){ return null; } }
const IMGCHIESTE={};
function chiediImg(pid){
  const can=S.can, k=can+"/"+pid;
  if(!window.DB||IMGCHIESTE[k]) return;
  IMGCHIESTE[k]=1;
  const usa=function(sn){
    const d=sn&&(sn.exists===false?null:(sn.data?sn.data():sn.v?sn:null));
    const v=d?(d.v||d.value):null;
    if(!v) return;
    IMG[k]=v;
    try{ localStorage.setItem("can-img-"+can+"-"+pid, v); }catch(e){}
    if(S.can===can) render();
  };
  try{
    const rif=DB.doc(chiaveDbImg(can,pid));
    if(rif&&typeof rif.get==="function"){ rif.get().then(usa).catch(function(){}); return; }
    if(rif&&typeof rif.onSnapshot==="function"){
      let stop=null;
      stop=rif.onSnapshot(function(sn){ usa(sn); try{ if(typeof stop==="function") stop(); }catch(e){} }, function(){});
    }
  }catch(e){}
}
function scriviImg(pid,dataUrl){
  IMG[S.can+"/"+pid]=dataUrl;
  let locale=true;
  try{ localStorage.setItem(chiaveImg(pid),dataUrl); }catch(e){ locale=false; }
  let nuvola=false;
  try{ if(window.DB){ DB.doc(chiaveDbImg(S.can,pid)).set({v:dataUrl}).catch(function(){}); nuvola=true; } }catch(e){}
  if(!locale&&!nuvola) toast("Tavola troppo grande per restare in memoria su questo dispositivo");
}

function adattaColonne(){
  const cols=document.querySelectorAll("#view-can .c2>.ccol");
  if(!cols.length) return;
  const largo=window.innerWidth>=1041;
  for(let i=0;i<cols.length;i++){
    const c=cols[i];
    if(!largo){ c.style.maxHeight=""; c.style.overflowY=""; c.style.removeProperty("--hpian"); continue; }
    const top=c.getBoundingClientRect().top;
    const h=Math.max(340, Math.round(window.innerHeight-top-14));
    c.style.maxHeight=h+"px";
    c.style.overflowY="auto";
    c.style.setProperty("--hpian", Math.max(220, h-150)+"px");
  }
}

function urgCliente(nome){
  try{
    const n=normn(nome);
    let c=(DATA.clienti||[]).find(function(x){ return normn(x.cliente)===n; });
    if(!c) c=(DATA.clienti||[]).find(function(x){ const k=normn(x.cliente); return k&&n&&(k.indexOf(n)>=0||n.indexOf(k)>=0); });
    if(!c) return null;
    if(c._prio==null){ try{ ricalcolaUrgenze(); }catch(e){} }
    return c._prio!=null?{v:c._prio, why:c._why||"", mod:!!c._mod}:null;
  }catch(e){ return null; }
}
function avviato(id){
  try{
    const c=(window.CANT||{})[id]; if(!c) return false;
    if(["lav","ev","piante","amb","tav","punti","prod","ditte","doc"].some(function(k){
      return Array.isArray(c[k]) && c[k].length; })) return true;
    if(Array.isArray(c.ck) && c.ck.some(function(r){ return r && r.e; })) return true;
    return false;
  }catch(e){ return false; }
}

    return '<div class="ccath"><i style="background:'+CATS[k].c+'"></i>'+esc(CATS[k].n)+

   (blocca.length?'<dt>Blocca</dt><dd>'+blocca.map(b=>b.n+". "+esc(b.tit)).join("<br>")+'</dd>':"")+

function dittaSalva(){

function vistaDiario(c){
  const q=(S.qDia||"").toLowerCase().trim();
  const conCat=c.ev.map(function(e){
    const l=e.lav?c.lav.find(function(x){ return x.id===e.lav; }):null;
    return {e:e, l:l, k:l?l.cat:null};
  });
  const usate=[];
  conCat.forEach(function(x){ if(x.k && usate.indexOf(x.k)<0) usate.push(x.k); });
  const generali=conCat.some(function(x){ return !x.k; });

  const passa=function(x){
    if(S.catDia==="gen" && x.k) return false;
    if(S.catDia && S.catDia!=="gen" && x.k!==S.catDia) return false;
    if(!q) return true;
    const testo=[x.e.txt, x.e.chi, x.l?x.l.tit:"", x.l?String(x.l.n):"", x.k?CATS[x.k].n:"", qr(x.e.t)].join(" ").toLowerCase();
    return testo.indexOf(q)>=0;
  };
  const vis=conCat.filter(passa);

  const conta=function(k){
    return conCat.filter(function(x){ return k==="gen" ? !x.k : (k?x.k===k:true); }).length;
  };
  const chips='<div class="cchips">'+
    '<button class="cchip'+(S.catDia?"":" on")+'" onclick="CA.catDia(null)">Tutto <b>'+conCat.length+'</b></button>'+
    usate.map(function(k){
      return '<button class="cchip'+(S.catDia===k?" on":"")+'" onclick="CA.catDia(\''+k+'\')">'+
        '<i style="background:'+CATS[k].c+'"></i>'+esc(CATS[k].b)+' <b>'+conta(k)+'</b></button>'; }).join("")+
    (generali?'<button class="cchip'+(S.catDia==="gen"?" on":"")+'" onclick="CA.catDia(\'gen\')">Generale <b>'+conta("gen")+'</b></button>':"")+
    '</div>';

  const cerca='<div class="ccerca"><input id="ca-qdia" type="search" placeholder="Cerca nel diario: parola, lavorazione, persona, data" value="'+esc(S.qDia||"")+'" oninput="CA.cercaDia(this.value)">'+
    (q?'<button class="cbtn" style="width:auto;margin:0;padding:8px 13px;font-size:13px" onclick="CA.cercaDia(\'\')">Pulisci</button>':"")+'</div>';

  const riga=function(x){
    const e=x.e, l=x.l;
    return '<div class="cev">'+
      (x.k?'<span class="cevk" style="background:'+CATS[x.k].c+'"></span>':'')+
      '<div class="w">'+qr(e.t)+(x.k?' &middot; '+esc(CATS[x.k].b):'')+'</div>'+
      '<div class="x">'+(l?"<b>"+l.n+". "+esc(l.tit)+"</b><br>":"")+esc(e.txt)+'</div>'+
      '<div class="q">'+esc(e.chi)+'</div></div>';
  };

  let corpo;
  if(!c.ev.length) corpo='<p class="chint">Ancora nessun evento. Si riempie da solo mano a mano che aggiorni le lavorazioni.</p>';
  else if(!vis.length) corpo='<p class="chint">Nessuna voce trovata'+(q?' per "'+esc(S.qDia)+'"':"")+'.</p>';
  else if(S.catDia||q) corpo=vis.map(riga).join("");
  else {
    const ordine=[];
    MEST.forEach(function(m){ m.c.forEach(function(k){ if(ordine.indexOf(k)<0) ordine.push(k); }); });
    const blocchi=ordine.filter(function(k){ return vis.some(function(x){ return x.k===k; }); }).map(function(k){
      const ls=vis.filter(function(x){ return x.k===k; });
      return '<div class="ccatbox" style="border-left-color:'+CATS[k].c+';background:'+tinta(CATS[k].c,.05)+'">'+
        '<div class="ccath forte"><i style="background:'+CATS[k].c+'"></i>'+esc(CATS[k].n)+'<span class="n">'+ls.length+'</span></div>'+
        ls.map(riga).join("")+'</div>'; });
    const gen=vis.filter(function(x){ return !x.k; });
    if(gen.length) blocchi.push('<div class="ccatbox" style="border-left-color:var(--cline2)">'+
      '<div class="ccath forte"><i style="background:var(--cfaint)"></i>Generale<span class="n">'+gen.length+'</span></div>'+gen.map(riga).join("")+'</div>');
    corpo=blocchi.join("");
  }
  return '<div class="csec">Diario di cantiere<span class="n">'+
    (vis.length===conCat.length?conCat.length+' eventi':vis.length+' di '+conCat.length)+'</span></div>'+
    '<div style="max-width:820px">'+cerca+chips+corpo+'</div>';
}

  return new Promise(function(ok,ko){
    if(!src){ ko(); return; }
    const i=new Image();
    i.onload=function(){ ok(i); }; i.onerror=function(){ ko(); };
