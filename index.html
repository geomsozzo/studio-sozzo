function righeTesto(cx, testo, larg){
  const fuori=[];
  String(testo||"").split(/\n/).forEach(function(par){
    const parole=par.split(/\s+/); let riga="";
    parole.forEach(function(w){
      const prova=riga?riga+" "+w:w;
      if(cx.measureText(prova).width>larg && riga){ fuori.push(riga); riga=w; } else riga=prova;
    });
    fuori.push(riga);
  });
  return fuori;
}
function schedaImmagine(id){
  const c=stato(S.can), l=c.lav.find(function(x){ return x.id===id; }), p=prat(S.can), pa=piantaAttiva();
  if(!l) return Promise.resolve(null);
  const W=1000, pad=40;
  const srcP=(pa&&!pa.src)?(IMG[S.can+"/"+pa.id]||leggiImg(pa.id)):null;
  return Promise.all([
    l.fsrc?caricaImmagine(l.fsrc).catch(function(){ return null; }):Promise.resolve(null),
    srcP?caricaImmagine(srcP).catch(function(){ return null; }):Promise.resolve(null)
  ]).then(function(im){
    const foto=im[0], pian=im[1];
    const hFoto=foto?Math.min(620, Math.round((W-pad*2)*foto.naturalHeight/foto.naturalWidth)):0;
    const hPian=pian?Math.round((W-pad*2)*pian.naturalHeight/pian.naturalWidth):0;
    const cv=document.createElement("canvas");
    const misura=document.createElement("canvas").getContext("2d");
    misura.font="30px Archivo, Arial, sans-serif";
    const larg=W-pad*2;
    const note=(l.fm||[]).filter(function(m){ return m.txt; });
    const corpo=[];
    if(l.nota) corpo.push({t:"Cosa serve", v:l.nota});
    if(l.loc) corpo.push({t:"Ambiente", v:l.loc});
    if(l.imp) corpo.push({t:"Impresa", v:l.imp});
    corpo.push({t:"Stato", v:ST[l.stato].l+", "+(l.pct||0)+"%"+(l.urg!=="normale"?", "+UR[l.urg]:"")});
    note.forEach(function(m){ corpo.push({t:"Punto "+m.n, v:m.txt}); });
    let hTesto=26;
    const righe=corpo.map(function(x){
      const r=righeTesto(misura, x.v, larg-190);
      hTesto+=Math.max(44, r.length*42)+12;
      return r;
    });
    const H=150+ (hFoto?hFoto+24:0) + (hPian?hPian+24:0) + hTesto + 150;
    cv.width=W; cv.height=H;
    const x=cv.getContext("2d");
    x.fillStyle="#ffffff"; x.fillRect(0,0,W,H);
    x.fillStyle="#1D6A8C"; x.fillRect(0,0,W,86);
    x.fillStyle="#ffffff"; x.font="600 30px Archivo, Arial, sans-serif";
    x.fillText(String(p.immobile||p.cliente||"Cantiere").slice(0,40), pad, 54);
    x.font="24px Archivo, Arial, sans-serif"; x.fillStyle="rgba(255,255,255,.85)";
    const dt=new Date().toLocaleDateString("it-IT");
    x.fillText(dt, W-pad-x.measureText(dt).width, 54);
    let y=140;
    x.fillStyle="#12202A"; x.font="700 38px Archivo, Arial, sans-serif";
    x.fillText((l.n+". "+l.tit).slice(0,44), pad, y); y+=22;
    x.fillStyle="#5B7183"; x.font="24px Archivo, Arial, sans-serif";
    x.fillText(CATS[l.cat].n, pad, y+22); y+=52;
    if(foto){
      const rr=Math.min(larg/foto.naturalWidth, hFoto/foto.naturalHeight);
      const w2=Math.round(foto.naturalWidth*rr), h2=Math.round(foto.naturalHeight*rr);
      x.fillStyle="#eef3f5"; x.fillRect(pad,y,larg,hFoto);
      x.drawImage(foto, pad+(larg-w2)/2, y+(hFoto-h2)/2, w2, h2);
      (l.fm||[]).forEach(function(m){
        const px=pad+(larg*m.x/100), py=y+(hFoto*m.y/100);
        x.beginPath(); x.arc(px,py,22,0,6.3); x.fillStyle="#B93A2E"; x.fill();
        x.lineWidth=4; x.strokeStyle="#fff"; x.stroke();
        x.fillStyle="#fff"; x.font="700 22px Archivo, Arial, sans-serif"; x.textAlign="center"; x.textBaseline="middle";
        x.fillText(String(m.n), px, py); x.textAlign="left"; x.textBaseline="alphabetic";
      });
      y+=hFoto+24;
    }
    if(pian){
      x.fillStyle="#ffffff"; x.fillRect(pad,y,larg,hPian);
      x.strokeStyle="#DCE7EE"; x.lineWidth=2; x.strokeRect(pad,y,larg,hPian);
      x.drawImage(pian, pad, y, larg, hPian);
      c.lav.forEach(function(o){
        if(!o.pin||o.id===l.id||o.stato==="verificata") return;
        if(o.piana&&pa&&o.piana!==pa.id) return;
        const px=pad+larg*(o.pin.x/800), py=y+hPian*(o.pin.y/560);
        x.beginPath(); x.arc(px,py,12,0,6.3); x.fillStyle=tinta(CATS[o.cat].c,.45); x.fill();
        x.lineWidth=3; x.strokeStyle="rgba(255,255,255,.8)"; x.stroke();
      });
      if(l.pin){
        const px=pad+larg*(l.pin.x/800), py=y+hPian*(l.pin.y/560);
        x.beginPath(); x.arc(px,py,30,0,6.3); x.fillStyle=CATS[l.cat].c; x.fill();
        x.lineWidth=5; x.strokeStyle="#fff"; x.stroke();
        x.beginPath(); x.arc(px,py,35,0,6.3); x.lineWidth=5; x.strokeStyle="#B93A2E"; x.stroke();
        x.fillStyle="#fff"; x.font="700 28px Archivo, Arial, sans-serif"; x.textAlign="center"; x.textBaseline="middle";
        x.fillText(String(l.n), px, py); x.textAlign="left"; x.textBaseline="alphabetic";
      }
      x.fillStyle="#5B7183"; x.font="22px Archivo, Arial, sans-serif";
      x.fillText((pa&&pa.nome)||"Planimetria", pad+8, y+hPian-14);
      y+=hPian+24;
    }
    y+=14;
    x.font="30px Archivo, Arial, sans-serif";
    corpo.forEach(function(voce, i){
      x.fillStyle="#5B7183"; x.font="600 24px Archivo, Arial, sans-serif";
      x.fillText(voce.t.toUpperCase(), pad, y+26);
      x.fillStyle="#12202A"; x.font="30px Archivo, Arial, sans-serif";
      righe[i].forEach(function(r,k){ x.fillText(r, pad+190, y+26+k*42); });
      y+=Math.max(44, righe[i].length*42)+12;
    });
    y+=10;
    x.strokeStyle="#DCE7EE"; x.lineWidth=2; x.beginPath(); x.moveTo(pad,y); x.lineTo(W-pad,y); x.stroke();
    x.fillStyle="#5B7183"; x.font="24px Archivo, Arial, sans-serif";
    x.fillText("Geom. Michele Sozzo", pad, y+40);
    const fine="Rispondere con una foto quando e fatto";
    x.fillText(fine, W-pad-x.measureText(fine).width, y+40);
    let out=""; try{ out=cv.toDataURL("image/jpeg",0.85); }catch(e){ out=""; }
    return out;
  }).catch(function(){ return null; });
}

function fileDaDataUrl(src, nome){
  try{

async function carica(input){
  const f=input.files&&input.files[0]; if(!f) return; chiudiModale();
  if(f.type.indexOf("image/")===0){ const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>aggiungi(f.name,fr.result,im.width/im.height); im.src=fr.result; };
    fr.readAsDataURL(f); return; }
  if(!window.pdfjsLib){ toast("Lettore PDF non disponibile, usa una foto"); return; }
  toast("Apro il PDF");
  try{
    const buf=await f.arrayBuffer();
    const doc=await pdfjsLib.getDocument({data:buf}).promise;
    const page=await doc.getPage(1);
    const v1=page.getViewport({scale:1});
    const vp=page.getViewport({scale:Math.min(2.6,Math.max(1,1500/v1.width))});
    const cv=document.createElement("canvas"); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
    const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:ctx,viewport:vp}).promise;
    aggiungi(f.name.replace(/\.pdf$/i,""),cv.toDataURL("image/jpeg",0.72),vp.width/vp.height);
  }catch(e){ toast("Il PDF non si e aperto, prova con una foto"); }
}

function leggiScatto(f, quando, max, q){
  if(!f){ toast("Nessuna foto scelta"); return; }
  max=max||1280; q=q||0.72;
  toast("Foto ricevuta, la preparo");
  const fine=function(bmp, w, h){
    if(!w||!h){ toast("La foto e arrivata vuota, riprova"); return; }
    let src="";
    try{
      const sc=Math.min(1, max/Math.max(w,h));
      const cw=Math.max(1,Math.round(w*sc)), ch=Math.max(1,Math.round(h*sc));
      const cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
      const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cw,ch);
      cx.drawImage(bmp,0,0,cw,ch);
      src=cv.toDataURL("image/jpeg",q);
    }catch(e){ toast("Foto troppo pesante per questo telefono"); return; }
    try{ if(bmp&&bmp.close) bmp.close(); }catch(e){}
    if(!src||src.length<200){ toast("Non riesco a convertire questa foto"); return; }
    try{ quando({width:w,height:h}, src); }catch(e){ toast("Foto letta ma non salvata: "+((e&&e.message)||"errore")); }
  };
  const viaImmagine=function(){
    const fr=new FileReader();
    fr.onerror=function(){ toast("Non riesco a leggere il file della foto"); };
    fr.onload=function(){
      const im=new Image();
      im.onerror=function(){ toast("Formato di foto non supportato"); };
      im.onload=function(){ fine(im, im.naturalWidth||im.width, im.naturalHeight||im.height); };
      im.src=fr.result;
    };
    try{ fr.readAsDataURL(f); }catch(e){ toast("Il telefono non apre questo file"); }
  };
  if(window.createImageBitmap){
    let pr=null;
    try{ pr=createImageBitmap(f,{imageOrientation:"from-image"}); }catch(e){ pr=null; }
    if(pr&&pr.then){ pr.then(function(bmp){ fine(bmp,bmp.width,bmp.height); }, viaImmagine); return; }
  }
  viaImmagine();
}

  document.body.appendChild(inp);

function riduciFoto(im, orig, max, q){
  try{
    max=max||1280; q=q||0.72;
    const W=im.naturalWidth||im.width, H=im.naturalHeight||im.height;

function salvaFoto(){
  fineLinea(true);
  const F=S.foto, c=stato(S.can), l=c.lav.find(x=>x.id===F.lav);
  const fine=function(src){
    if(l){
      if(F.idx==null){ l.foto=(l.foto||0)+1; l.fsrc=src; l.far=F.ar; l.fm=F.m; l.ftr=F.tr||[]; }
      else {
        const g=galleria(l);
        if(g[F.idx]) g[F.idx]={src:src, ar:F.ar, m:F.m, tr:F.tr||[], q:oggi()};
        else g.push({src:src, ar:F.ar, m:F.m, tr:F.tr||[], q:oggi()});
      }
      l.agg=oggi();
      nota("Allegata foto con "+F.m.length+" note"+((F.tr||[]).length?" e "+F.tr.length+" segni a mano":"")+".",l.id); }
    S.foto=null; S.dis=false; S.sub="pianta"; S.sel=l?l.id:null; salva(); render();
    if(l&&l.daNominare){ delete l.daNominare; salva(); modifica(l.id); toast("Dai un nome alla lavorazione"); return; }
    toast(memoriaPiena()?"Foto troppo pesante, la memoria di questo dispositivo e piena":"Foto salvata sulla lavorazione");
  };
  if(!(F.tr||[]).length){ fine(F.src); return; }
  const im=new Image();
  im.onload=function(){
    try{
      const sc=Math.min(1, 1280/Math.max(im.naturalWidth,im.naturalHeight));
      const cv=document.createElement("canvas");
      cv.width=Math.max(1,Math.round(im.naturalWidth*sc)); cv.height=Math.max(1,Math.round(im.naturalHeight*sc));
      const x=cv.getContext("2d"); x.drawImage(im,0,0,cv.width,cv.height); x.lineCap="round"; x.lineJoin="round";
      (F.tr||[]).forEach(function(t){ x.strokeStyle=t.c; x.lineWidth=Math.max(2,(t.w||0.7)/100*cv.width);
        x.beginPath(); t.p.forEach(function(pt,i){ const px=pt[0]/100*cv.width, py=pt[1]/100*cv.height;
          if(i===0) x.moveTo(px,py); else x.lineTo(px,py); }); x.stroke(); });
      fine(cv.toDataURL("image/jpeg",0.72));
    }catch(e){ fine(F.src); }
  };
  im.onerror=function(){ fine(F.src); };
  im.src=F.src;
}

function testoCondivisione(l){
  const p=prat(S.can), en=S.en, r=[];
  r.push((en?"Site: ":"Cantiere: ")+(p.immobile||p.cliente||""));
  r.push((en?"Task ":"Lavorazione ")+l.n+": "+l.tit);
  r.push((en?"Trade: ":"Categoria: ")+CATS[l.cat].n+(l.loc?" ("+l.loc+")":""));
  r.push((en?"Status: ":"Stato: ")+ST[l.stato].l+", "+(l.pct||0)+"%");
  if(l.urg!=="normale") r.push((en?"Priority: ":"Priorita: ")+UR[l.urg]);
  if(l.nota) r.push((en?"What is needed: ":"Cosa serve: ")+l.nota);
  const note=(l.fm||[]).filter(function(m){ return m.txt; });
  if(note.length){
    r.push("");
    r.push(en?"Notes on the photo:":"Note sulla foto:");
    note.forEach(function(m){ r.push(m.n+". "+m.txt); });
  }
  r.push("");
  r.push(en?"Please reply with a photo once done.":"Rispondere con una foto quando e fatto.");
  r.push("Geom. Michele Sozzo");
  return r.join("\n");
}
function copiaAMano(t){
  try{
    const a=document.createElement("textarea"); a.value=t;
    a.style.position="fixed"; a.style.top="-2000px"; document.body.appendChild(a);
    a.focus(); a.select();
    const ok=document.execCommand("copy"); document.body.removeChild(a);
    toast(ok?"Testo copiato, incollalo dove vuoi":"Non riesco a copiare, seleziona il testo a mano");
  }catch(e){ toast("Non riesco a copiare, seleziona il testo a mano"); }
}
function copiaTesto(){
  const a=el("ca-cond"); const t=a?a.value:"";
  if(!t){ toast("Non c'e' niente da copiare"); return; }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ toast("Testo copiato, incollalo dove vuoi"); })
        .catch(function(){ copiaAMano(t); });
      return;
    }
  }catch(e){}
  copiaAMano(t);
}

function testoReport(){
  const c=stato(S.can), p=prat(S.can);
  const vis=lavVisibili().filter(function(l){ return l.stato!=="verificata"; });
  const r=[];
  r.push("CANTIERE: "+(p.immobile||p.cliente||""));
  r.push("Aggiornato al "+new Date().toLocaleDateString("it-IT"));
  r.push("");
  r.push("DA COMPLETARE ("+vis.length+")");
  MEST.forEach(function(m){
    const ls=vis.filter(function(l){ return mestDi(l.cat)===m.id; });
    if(!ls.length) return;
    r.push("");
    r.push("-- "+m.l.toUpperCase()+" --");
    ls.forEach(function(l){
      r.push(l.n+". "+l.tit+" ["+CATS[l.cat].b+(l.loc?", "+l.loc:"")+"]");
      const d=[ST[l.stato].l, (l.pct||0)+"%"];
      if(l.urg!=="normale") d.push(UR[l.urg]);
      if(!l.pin) d.push("non sulla pianta");
      r.push("   "+d.join(", "));
      if(l.nota) r.push("   "+l.nota);
    });
  });
  r.push("");
  r.push("Rispondere con una foto di ogni lavorazione completata.");
  r.push("Geom. Michele Sozzo");
  return r.join("\n");
}

    d.innerHTML='<div class="rep">'+corpo+'</div>';

    toast("Preparo la stampa");

      setTimeout(function(){ const x=document.getElementById("ca-stampa"); if(x) x.remove(); }, 1500);

}

function copiaFoto(id){
  const c=stato(S.can), l=c.lav.find(function(x){ return x.id===id; });
  if(!l||!l.fsrc){ toast("Questa lavorazione non ha una foto"); return; }
  const nope=function(){ toast("Il browser non permette di copiare l'immagine: tieni premuto sulla foto e scegli Copia"); };
  const im=new Image();
  im.onload=function(){
    try{
      const cv=document.createElement("canvas"); cv.width=im.naturalWidth; cv.height=im.naturalHeight;
      cv.getContext("2d").drawImage(im,0,0);
      cv.toBlob(function(b){
        if(!b||!window.ClipboardItem||!navigator.clipboard||!navigator.clipboard.write){ nope(); return; }
        navigator.clipboard.write([new ClipboardItem({"image/png":b})])
          .then(function(){ toast("Foto copiata, incollala nel messaggio"); })
          .catch(nope);
      },"image/png");
    }catch(e){ nope(); }
  };
  im.onerror=function(){ toast("Non riesco a leggere la foto"); };
  im.src=l.fsrc;
}

/* ---- zoom pubblico ---- */
function zoom(d){ const vw=el("ca-pv"); if(vw) zoomVerso(Z.k*(d>0?1.6:1/1.6),vw.clientWidth/2,vw.clientHeight/2); }
function vista(dentro,ar){
  const r=ar||800/560;
  return '<div class="pview" id="ca-pv" style="aspect-ratio:'+r+';max-width:calc(var(--hpian,60vh) * '+r+');margin:0 auto">'+

}
function applica(){ const cv=el("ca-cv"),vw=el("ca-pv"); if(!cv||!vw) return;
  const w=vw.clientWidth,h=vw.clientHeight;
  Z.k=Math.min(8,Math.max(1,Z.k)); Z.x=Math.min(0,Math.max(-(Z.k-1)*w,Z.x)); Z.y=Math.min(0,Math.max(-(Z.k-1)*h,Z.y));
  cv.style.transform="translate("+Z.x+"px,"+Z.y+"px) scale("+Z.k+")"; cv.style.setProperty("--k",Z.k);
  const l=el("ca-lvl"); if(l) l.textContent=Math.round(Z.k*100)+"%"; }
function zoomVerso(k2,px,py){ const k1=Z.k; k2=Math.min(8,Math.max(1,k2));
  Z.x=px-(px-Z.x)*(k2/k1); Z.y=py-(py-Z.y)*(k2/k1); Z.k=k2; applica(); }
function coord(cx,cy){ const vw=el("ca-pv"),r=vw.getBoundingClientRect();
  return {x:Math.round(((cx-r.left-Z.x)/Z.k)/r.width*800),y:Math.round(((cy-r.top-Z.y)/Z.k)/r.height*560)}; }
function tocca(cx,cy){
  if(S.rot&&S.full){ toast("Raddrizza la pianta per mettere un pin"); return; }
  if(S.sub==="foto"){ nuovaNota(cx,cy); return; }
  if(S.sub==="tav"){ const vw=el("ca-pv"),r=vw.getBoundingClientRect();
    puntoForm(+(((cx-r.left-Z.x)/Z.k)/r.width*100).toFixed(2), +(((cy-r.top-Z.y)/Z.k)/r.height*100).toFixed(2)); return; }
  const p=coord(cx,cy), c=stato(S.can);
  if(S.pos){ const l=c.lav.find(x=>x.id===S.pos); const pa=piantaAttiva();
    l.pin={x:p.x,y:p.y}; l.piana=pa?pa.id:null; l.agg=oggi(); S.pos=null;
    nota("Lavorazione "+l.n+" localizzata sulla pianta.",l.id); salva(); render(); toast("Pin "+l.n+" posizionato"); return; }
  formPin(p.x,p.y);
}
function attacca(){
  const vw=el("ca-pv"); if(!vw) return; Z={k:1,x:0,y:0}; applica();
  const pts=new Map(); let st=null,mosso=false,tl=0,dis=false;
  const pc=function(cx,cy){ const r=vw.getBoundingClientRect();
    return {x:+(((cx-r.left-Z.x)/Z.k)/r.width*100).toFixed(2), y:+(((cy-r.top-Z.y)/Z.k)/r.height*100).toFixed(2)}; };
  const dist=()=>{const a=[...pts.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
  const mid=()=>{const a=[...pts.values()];const r=vw.getBoundingClientRect();return{x:(a[0].x+a[1].x)/2-r.left,y:(a[0].y+a[1].y)/2-r.top};};
  vw.addEventListener("pointerdown",e=>{
    if(S.dis&&S.linea&&S.sub==="foto"&&S.foto){
      const p=pc(e.clientX,e.clientY);
      const u=S.foto.tr[S.foto.tr.length-1];
      if(u&&u.aperta&&u.p.length){
        const a=snap(p, u.p[u.p.length-1], vw.getBoundingClientRect());
        u.p.push([a.x,a.y]); delete u.aperta; S.ante=null; salva();
      } else { S.foto.tr.push({c:S.col,w:0.7,p:[[p.x,p.y]],aperta:true}); S.ante={x:p.x,y:p.y}; }
      aggiornaTratti(); e.preventDefault(); return; }
    if(S.dis&&S.sub==="foto"&&S.foto){ const p=pc(e.clientX,e.clientY); S.foto.tr.push({c:S.col,w:0.7,p:[[p.x,p.y]]}); dis=true; aggiornaTratti(); e.preventDefault(); return; }
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ st={x:e.clientX,y:e.clientY,ox:Z.x,oy:Z.y,t:Date.now()}; mosso=false; }
    if(pts.size===2){ st={d:dist(),k:Z.k,m:mid()}; mosso=true; } });
  const snap=function(p,q,r){
    const dx=(p.x-q[0])/100*r.width, dy=(p.y-q[1])/100*r.height;
    if(Math.abs(dx)<Math.abs(dy)*0.18) return {x:q[0], y:p.y};
    if(Math.abs(dy)<Math.abs(dx)*0.18) return {x:p.x, y:q[1]};
    return {x:p.x, y:p.y};
  };
  vw.addEventListener("pointermove",e=>{
    if(S.dis&&S.linea&&S.sub==="foto"&&S.foto){
      const u=S.foto.tr[S.foto.tr.length-1];
      if(u&&u.aperta&&u.p.length){
        const a=snap(pc(e.clientX,e.clientY), u.p[u.p.length-1], vw.getBoundingClientRect());
        if(!S.ante||Math.abs(S.ante.x-a.x)+Math.abs(S.ante.y-a.y)>0.2){ S.ante=a; aggiornaTratti(); }
      }
      return; }
    if(dis){ const p=pc(e.clientX,e.clientY), t=S.foto.tr[S.foto.tr.length-1], u=t.p[t.p.length-1];
      if(Math.abs(u[0]-p.x)+Math.abs(u[1]-p.y)>0.25){ t.p.push([p.x,p.y]); aggiornaTratti(); } e.preventDefault(); return; }
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&st&&st.d){ zoomVerso(st.k*(dist()/st.d),st.m.x,st.m.y); e.preventDefault(); return; }
    if(pts.size===1&&st){ const dx=e.clientX-st.x,dy=e.clientY-st.y;
      if(Math.hypot(dx,dy)>7){ mosso=true; Z.x=st.ox+dx; Z.y=st.oy+dy; applica(); e.preventDefault(); } } });
  vw.addEventListener("pointerup",e=>{
    if(dis){ dis=false; salva(); return; }
    pts.delete(e.pointerId); if(pts.size>0){ st=null; return; }
    const tap=st&&!mosso&&Date.now()-st.t<450;
    if(tap){ const ora=Date.now();
      if(ora-tl<300){ tl=0; const r=vw.getBoundingClientRect(); zoomVerso(Z.k>1.5?1:2.6,e.clientX-r.left,e.clientY-r.top); }
      else { tl=ora; setTimeout(()=>{ if(tl!==ora) return; if(e.target.closest(".pin")) return; tocca(e.clientX,e.clientY); },300); } }
    st=null; mosso=false; });
  vw.addEventListener("pointercancel",e=>{ pts.delete(e.pointerId); st=null; });
  vw.addEventListener("wheel",e=>{ e.preventDefault(); const r=vw.getBoundingClientRect();
    zoomVerso(Z.k*(e.deltaY<0?1.15:1/1.15),e.clientX-r.left,e.clientY-r.top); },{passive:false});
}

async function tavCarica(input,ambId){
  const f=input.files&&input.files[0]; if(!f) return;
  const c=stato(S.can), id="v"+Date.now().toString(36);
  const fatto=(src,ar)=>{ c.tav.push({id:id,amb:ambId,nome:f.name.replace(/\.(pdf|jpe?g|png)$/i,""),ar:ar,q:oggi()});
    scriviImg(id,src); nota("Caricato un prospetto interno."); salva(); S.tavA=id; S.sub="tav"; render(); toast("Prospetto caricato"); };
  if(f.type.indexOf("image/")===0){ const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>fatto(fr.result,im.width/im.height); im.src=fr.result; };
    fr.readAsDataURL(f); return; }
  if(!window.pdfjsLib){ toast("Lettore PDF non disponibile, usa una foto"); return; }
  toast("Apro il PDF");
  try{
    const buf=await f.arrayBuffer(); const doc=await pdfjsLib.getDocument({data:buf}).promise;
    const page=await doc.getPage(1); const v1=page.getViewport({scale:1});
    const vp=page.getViewport({scale:Math.min(2.6,Math.max(1,1500/v1.width))});
    const cv=document.createElement("canvas"); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
    const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:ctx,viewport:vp}).promise;
    fatto(cv.toDataURL("image/jpeg",0.72), vp.width/vp.height);
  }catch(e){ toast("Il PDF non si &egrave; aperto, prova con una foto"); }
}

/* ---- documenti del cantiere ---- */
function chiaveDoc(id){ return "can-doc-"+S.can+"-"+id; }
function leggiDoc(id){ try{ return localStorage.getItem(chiaveDoc(id)); }catch(e){ return null; } }
function scriviDoc(id,d){ try{ localStorage.setItem(chiaveDoc(id),d); return true; }catch(e){ return false; } }
function docNuovo(input, ditta){
  const f=input.files&&input.files[0]; if(!f) return;
  const c=stato(S.can), id="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const ext=(f.name.split(".").pop()||"file").toLowerCase().slice(0,4);
  const reg=function(anteprima){
    const d={id:id,nome:f.name.replace(/\.[^.]+$/,""),ext:ext,q:oggi(),ditta:ditta||null,peso:f.size||0,ok:false};
    if(anteprima) d.ok=scriviDoc(id,anteprima);
    c.doc.push(d);
    nota("Caricato il documento "+d.nome+(ditta?" della ditta":"")+".");
    salva(); render();
    toast(d.ok?"Documento caricato":"Documento registrato, il file e troppo grande per restare in memoria");
  };
  if(f.type.indexOf("image/")===0){
    const fr=new FileReader();
    fr.onload=function(){ const im=new Image(); im.onload=function(){ reg(riduciFoto(im,fr.result,1400,0.7)); }; im.onerror=function(){ reg(null); }; im.src=fr.result; };
    fr.readAsDataURL(f); return;
  }
  if(f.type==="application/pdf" && window.pdfjsLib){
    toast("Apro il PDF");
    f.arrayBuffer().then(function(buf){ return pdfjsLib.getDocument({data:buf}).promise; })
     .then(function(doc){ return doc.getPage(1); })
     .then(function(page){
       const v1=page.getViewport({scale:1});
       const vp=page.getViewport({scale:Math.min(2,Math.max(1,1100/v1.width))});
       const cv=document.createElement("canvas"); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
       const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
       return page.render({canvasContext:ctx,viewport:vp}).promise.then(function(){ reg(cv.toDataURL("image/jpeg",0.7)); });
     }).catch(function(){ reg(null); });
    return;
  }
  reg(null);
}

  const c=stato(S.can), d=c.doc.find(function(x){ return x.id===id; }); if(!d) return;
  const src=leggiDoc(id);

/* ---- disegno a mano sulla foto ---- */
function croce(x,y,c){
  return '<line x1="'+(x-1.1)+'" y1="'+y+'" x2="'+(x+1.1)+'" y2="'+y+'" stroke="'+c+'" stroke-width="2.5" vector-effect="non-scaling-stroke"/>'+
         '<line x1="'+x+'" y1="'+(y-1.1)+'" x2="'+x+'" y2="'+(y+1.1)+'" stroke="'+c+'" stroke-width="2.5" vector-effect="non-scaling-stroke"/>';
}
function anteprimaLinea(t){
  const u=t.length?t[t.length-1]:null;
  if(!u||!u.aperta||!u.p.length) return '';
  let o=u.p.map(function(p){ return croce(p[0],p[1],u.c); }).join('');
  const q=u.p[u.p.length-1];
  if(S.ante) o+='<line x1="'+q[0]+'" y1="'+q[1]+'" x2="'+S.ante.x+'" y2="'+S.ante.y+'" stroke="'+u.c+
    '" stroke-width="3" stroke-dasharray="7 6" opacity=".9" vector-effect="non-scaling-stroke" stroke-linecap="round"/>';
  return o;
}
function tratti(F){
  const t=(F&&F.tr)||[];
  return '<svg id="ca-tr" viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">'+
    anteprimaLinea(t)+
    t.map(function(x){ return '<polyline points="'+x.p.map(function(p){return p[0]+","+p[1];}).join(" ")+
      '" fill="none" stroke="'+x.c+'" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>'; }).join("")+
    '</svg>';
}
function aggiornaTratti(){ const s=el("ca-tr"); if(s&&S.foto) s.outerHTML=tratti(S.foto); }
function modo(d){ S.dis=!!d; S.linea=false; fineLinea(true); render(); }
function modoLinea(){ S.dis=true; S.linea=true; render(); }
function fineLinea(zitto){
  S.ante=null;
  if(S.foto&&S.foto.tr&&S.foto.tr.length){
    const u=S.foto.tr[S.foto.tr.length-1];
    if(u&&u.aperta){ delete u.aperta; if(u.p.length<2) S.foto.tr.pop(); }
  }
  if(!zitto){ salva(); render(); }
}
function colore(c){ S.col=c; S.dis=true; render(); }
function annullaTratto(){ if(S.foto&&S.foto.tr&&S.foto.tr.length){ S.foto.tr.pop(); render(); } }
function puliscTratti(){ if(S.foto){ S.foto.tr=[]; render(); } }
function galApri(id, i){
  const c=stato(S.can), l=c.lav.find(function(x){ return x.id===id; }); if(!l) return;
  const g=galleria(l)[i]; if(!g) return;
  S.foto={src:g.src,ar:g.ar||1.4,m:(g.m||[]).slice(),tr:(g.tr||[]).slice(),lav:id,idx:i};
  S.dis=false; S.sub="foto"; S.sel=null; render();
}
function galElimina(){
  const F=S.foto; if(!F) return;
  const c=stato(S.can), l=c.lav.find(function(x){ return x.id===F.lav; });
  if(!l){ annullaFoto(); return; }
  if(F.idx==null){ delete l.fsrc; delete l.far; l.fm=[]; l.ftr=[]; nota("Rimossa la foto principale della lavorazione "+l.n+".",l.id); }
  else { const g=galleria(l); g.splice(F.idx,1); nota("Rimossa una foto della lavorazione "+l.n+".",l.id); }
  l.agg=oggi(); S.foto=null; S.dis=false; S.sub="pianta"; S.sel=l.id; salva(); render(); toast("Foto rimossa");
}
function fotoApri(id){
  const c=stato(S.can), l=c.lav.find(x=>x.id===id);

  S.foto={src:l.fsrc,ar:l.far||1.4,m:(l.fm||[]).slice(),tr:(l.ftr||[]).slice(),lav:id,idx:null};
  S.dis=false; S.sub="foto"; S.sel=null; render();
}

function scattoAtteso(){

function azioniFoto(l){

}
function strisciaFoto(l){
  const g=galleria(l);
  if(!l.fsrc&&!g.length) return '';
  const tutte=[].concat(l.fsrc?[{src:l.fsrc,i:null,n:(l.fm||[]).length}]:[],
    g.map(function(x,i){ return {src:x.src,i:i,n:(x.m||[]).length}; }));
  if(tutte.length<2) return '';
  return '<div class="cgal">'+tutte.map(function(x,k){
    return '<button onclick="'+(x.i==null?'CA.fotoApri('+l.id+')':'CA.galApri('+l.id+','+x.i+')')+'">'+
      '<img src="'+x.src+'" alt="">'+(x.n?'<i>'+x.n+'</i>':'')+'<u>'+(k+1)+'</u></button>'; }).join("")+'</div>';
}
function bloccoFoto(l){
  if(!l.fsrc){
    return '<div class="cvfoto" style="height:100%;display:grid;place-items:center">Nessuna foto</div>';
  }
  const ar=l.far||1.4;
  return '<button class="cfoto" onclick="CA.fotoApri('+l.id+')" title="Apri la foto grande">'+
   '<span class="cfin" style="aspect-ratio:'+ar+'"><img src="'+l.fsrc+'" alt="">'+
   (l.fm||[]).map(function(m){ return '<span class="fm" style="left:'+m.x+'%;top:'+m.y+'%">'+m.n+'</span>'; }).join("")+
   '</span><span class="cfz">ingrandisci</span></button>';
}
function noteFoto2(l){
  if(!l.fsrc||!(l.fm||[]).length) return '';
  return '<div class="clist" style="margin-top:9px">'+l.fm.map(function(m){
    return '<div class="cli"><span class="cnum" style="background:#B93A2E">'+m.n+'</span>'+
    '<span class="m"><span class="t">'+esc(m.txt||"senza testo")+'</span></span>'+quando(m.q)+'</div>'; }).join("")+'</div>';
}

<script id="ca-prova">
/* Paginetta di prova, si apre solo aggiungendo #prova all'indirizzo. */
(function(){
  function pronto(f){ if(document.readyState!=="loading") f(); else document.addEventListener("DOMContentLoaded",f); }
  pronto(function(){
    try{
      var v=document.getElementById("vers");
      if(v&&window.VERSIONE) v.textContent=window.VERSIONE;
    }catch(e){}
    /* la barra di prova non serve piu', il pannello resta raggiungibile
       aggiungendo #prova in fondo all'indirizzo */
  });
  window.apriProva=function(){
    var d=document.createElement("div");
    d.id="cprova";
    d.style.cssText="position:fixed;inset:0;z-index:99999;background:#0E1A24;color:#EAF2F8;overflow:auto;padding:18px;font:14px/1.5 system-ui,Arial;-webkit-text-size-adjust:100%";
    d.innerHTML=
      '<h2 style="margin:0 0 4px;font-size:19px">Prova del telefono</h2>'+
      '<p style="margin:0 0 14px;color:#9DB6C8;font-size:13px">Premi i pulsanti uno per uno e mandami la schermata.</p>'+
      '<div id="pinfo" style="background:#16242E;border-radius:8px;padding:12px;margin:0 0 14px;font-size:13px;white-space:pre-line"></div>'+
      '<div style="display:grid;gap:10px">'+
      '<button data-p="share">1. Condividi una immagine</button>'+
      '<button data-p="testo">2. Condividi solo testo</button>'+
      '<button data-p="wapp">3. Apri WhatsApp Business</button>'+
      '<button data-p="wtop">4. Apri WhatsApp, altra via</button>'+
      '<button data-p="stampa">5. Stampa</button>'+
      '<span style="position:relative;display:block"><button style="width:100%">6. Fotocamera</button>'+
      '<input type="file" accept="image/*" capture="environment" id="pcam" style="position:absolute;inset:0;opacity:0;width:100%;height:100%"></span>'+
      '<button data-p="scarica">7. Scarica un file</button>'+
      '<button data-p="fuori" style="background:#B8730D">8. Esci dalla cornice</button>'+
      '<button data-p="chiudi" style="background:#3A4C5C">Chiudi</button>'+
      '</div>'+
      '<div id="pesito" style="margin-top:16px;background:#16242E;border-radius:8px;padding:12px;font-size:13px;white-space:pre-line;min-height:60px"></div>';
    document.body.appendChild(d);
    var st=document.createElement("style");
    st.textContent="#cprova,#cprova *{box-sizing:border-box;max-width:100%}#cprova button{font:inherit;font-weight:600;background:#1668DC;color:#fff;border:0;border-radius:9px;padding:13px 14px;width:100%;text-align:left}";
    document.head.appendChild(st);

    var esito=document.getElementById("pesito"), righe=[];
    function dì(t){ righe.unshift(t); esito.textContent=righe.join("\n"); }

    var f2=null;
    try{ f2 = new File([new Uint8Array([1,2,3])],"p.jpg",{type:"image/jpeg"}); }catch(e){}
    document.getElementById("pinfo").textContent =
      "dentro una cornice: "+(window.top!==window.self ? "sì" : "no")+"\n"+
      "indirizzo: "+location.host+"\n"+
      "navigator.share: "+(navigator.share?"c'è":"NON c'è")+"\n"+
      "canShare con file: "+((navigator.canShare&&f2)?(navigator.canShare({files:[f2]})?"sì":"no"):"non verificabile")+"\n"+
      "larghezza della pagina: "+window.innerWidth+"\n"+
      "larghezza dello schermo: "+(window.screen&&window.screen.width);

    function immagine(){
      var cv=document.createElement("canvas"); cv.width=600; cv.height=400;
      var x=cv.getContext("2d");
      x.fillStyle="#1668DC"; x.fillRect(0,0,600,400);
      x.fillStyle="#fff"; x.font="bold 34px sans-serif";
      x.fillText("Studio Sozzo", 40, 190); x.font="20px sans-serif";
      x.fillText("prova di condivisione", 40, 230);
      return cv.toDataURL("image/jpeg",0.85);
    }
    function fileDa(src){
      var p=src.split(","), bin=atob(p[1]), a=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
      return new File([a],"prova.jpg",{type:"image/jpeg"});
    }
    d.addEventListener("click", function(e){
      var b=e.target.closest("button[data-p]"); if(!b) return;
      var q=b.getAttribute("data-p");
      if(q==="chiudi"){ d.remove(); location.hash=""; return; }
      if(q==="share"){
        if(!navigator.share){ dì("1. navigator.share non esiste"); return; }
        var f;
        try{ f=fileDa(immagine()); }catch(er){ dì("1. non riesco a creare il file: "+er.message); return; }
        try{
          navigator.share({files:[f], text:"prova"})
            .then(function(){ dì("1. OK, si è aperto il pannello di condivisione"); })
            .catch(function(er){ dì("1. rifiutata: "+er.name+" , "+er.message); });
        }catch(er){ dì("1. eccezione: "+er.name+" , "+er.message); }
        return;
      }
      if(q==="testo"){
        if(!navigator.share){ dì("2. navigator.share non esiste"); return; }
        try{
          navigator.share({text:"prova di testo da Studio Sozzo"})
            .then(function(){ dì("2. OK, pannello aperto"); })
            .catch(function(er){ dì("2. rifiutata: "+er.name+" , "+er.message); });
        }catch(er){ dì("2. eccezione: "+er.name+" , "+er.message); }
        return;
      }
      if(q==="wapp"){
        var w=null;
        try{ w=window.open("whatsapp://send?text=prova","_blank"); }catch(er){ dì("3. eccezione: "+er.message); return; }
        dì("3. window.open ha risposto "+(w?"una finestra":"niente"));
        return;
      }
      if(q==="wtop"){
        try{ window.top.location.href="whatsapp://send?text=prova"; dì("4. comando inviato alla finestra principale"); }
        catch(er){ dì("4. bloccato: "+er.name+" , "+er.message); }
        return;
      }
      if(q==="stampa"){
        dì("5. lancio la stampa, se l'app si blocca dimmelo");
        setTimeout(function(){ try{ window.print(); }catch(er){ dì("5. eccezione: "+er.message); } }, 300);
        return;
      }
      if(q==="fuori"){
        try{ window.top.location.href=location.href; dì("8. comando inviato"); }
        catch(er){ dì("8. bloccato: "+er.name+" , "+er.message); }
        return;
      }
      if(q==="scarica"){
        try{
          var a=document.createElement("a");
          a.href=immagine(); a.download="prova.jpg";
          document.body.appendChild(a); a.click(); a.remove();
          dì("7. comando di scaricamento inviato, controlla se il file è arrivato");
        }catch(er){ dì("7. bloccato: "+er.message); }
        return;
      }
    });
    document.getElementById("pcam").addEventListener("change", function(){
      var f=this.files&&this.files[0];
      dì(f ? ("6. foto ricevuta: "+f.name+" , "+Math.round(f.size/1024)+" kB") : "6. nessuna foto");
    });
  };
  pronto(function(){
    if(String(location.hash||"").indexOf("prova")>=0) window.apriProva();
  });
  window.addEventListener("hashchange", function(){
    if(String(location.hash||"").indexOf("prova")>=0 && !document.getElementById("cprova")) window.apriProva();
  });
})();
</script>

      '<button id="cimp-v" style="font:inherit;font-weight:700;background:#1668DC;color:#fff;border:0;border-radius:10px;padding:14px 20px;width:100%;box-sizing:border-box">Travasa</button>'+
      '<button id="cimp-x" style="font:inherit;font-weight:600;background:#3A4C5C;color:#fff;border:0;border-radius:10px;padding:12px 20px;width:100%;box-sizing:border-box;margin-top:10px">Chiudi</button>'+
      '<div id="cimp-m" style="margin-top:16px;background:#16242E;border-radius:8px;padding:12px;font-size:13px;white-space:pre-line;min-height:60px"></div>';
    document.body.appendChild(d);
    document.getElementById("cimp-x").onclick=function(){ d.remove(); location.hash=""; };
    document.getElementById("cimp-v").onclick=function(){
      var m=document.getElementById("cimp-m");
      var f=document.getElementById("cimp-f").files[0];
      if(!f){ m.textContent="Scegli prima il file."; return; }
      if(!window.DB){ m.textContent="L'archivio non e' collegato, non posso travasare."; return; }
      m.textContent="Leggo il file...";
      var r=new FileReader();
      r.onload=function(){
        var mappa;
        try{ mappa=JSON.parse(r.result); }catch(e){ m.textContent="Il file non e' leggibile: "+e.message; return; }
        var voci=Object.keys(mappa), i=0, fatte=[], errori=0;
        function una(){
          if(i>=voci.length){
            m.textContent=fatte.join("\n")+"\n\nFinito, "+(voci.length-errori)+" documenti su "+voci.length+".\nRicarica la pagina.";
            return;
          }
          var nome=voci[i++], val=mappa[nome];
          m.textContent=fatte.join("\n")+"\nsto scrivendo "+nome+"...";
          var scritture=[];
          try{
          if(nome==="stato/cantieri" && val && val.v){
            var sm=smontaFoto(val.v);
            sm.fuori.forEach(function(par){ scritture.push(window.DB.doc(par[0]).set({v:par[1]})); });
            scritture.push(window.DB.doc(nome).set({v:sm.dati}));
            fatte.push(nome+" , piu' "+sm.fuori.length+" foto separate");
          } else {
            scritture.push(window.DB.doc(nome).set(val));
            fatte.push(nome);
          }
          }catch(er){ errori++; fatte.push(nome+" ERRORE: "+((er&&er.message)||er)); m.textContent=fatte.join("\n"); setTimeout(una, 60); return; }
          Promise.all(scritture).then(function(){ setTimeout(una, 60); })
            .catch(function(e){ errori++; fatte.push(nome+" ERRORE: "+((e&&e.message)||e)); setTimeout(una, 60); });
        }
        una();
      };
      r.readAsText(f,"UTF-8");
    };
  };
  function guarda(){ if(String(location.hash||"").indexOf("importa")>=0) window.apriImporta(); }
  pronto(guarda);
  window.addEventListener("hashchange", guarda);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { });
  });
}
</script>
